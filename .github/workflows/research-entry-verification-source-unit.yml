name: research-entry-verification-source-unit

on:
  push:
    branches:
      - research/entry-verification-source-unit-binding-gpt56sol
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused regression
        run: cargo test -p plaid-core --test entry_verification_source_unit -- --nocapture
      - name: Full plaid-core suite
        run: cargo test -p plaid-core
