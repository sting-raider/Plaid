name: Stage PageMask integration docs

on:
  push:
    branches:
      - direct-integration/pagemask-geometry-gpt56sol-direct-pagemask-geometry-20261011

permissions:
  contents: write

jobs:
  append-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/pagemask-geometry-gpt56sol-direct-pagemask-geometry-20261011
      - name: Append canonical state
        shell: bash
        run: |
          set -euo pipefail
          STATUS_B64=''
          NEXT_B64=''
          DEC_B64=''
          grep -q 'bounded `tlb_geometry` primitive' docs/STATUS.md || printf '%s' "$STATUS_B64" | base64 -d >> docs/STATUS.md
          grep -q 'Production PageMask geometry is now bounded' docs/NEXT.md || printf '%s' "$NEXT_B64" | base64 -d >> docs/NEXT.md
          grep -q '^## ADR-0104: PageMask geometry' docs/DECISIONS.md || printf '%s' "$DEC_B64" | base64 -d >> docs/DECISIONS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STATUS.md docs/NEXT.md docs/DECISIONS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Document bounded PageMask geometry'
            git push origin HEAD:direct-integration/pagemask-geometry-gpt56sol-direct-pagemask-geometry-20261011
          fi
