name: research-overlay-region-binding

on:
  push:
    branches:
      - research/overlay-region-binding-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply candidate fix
        run: python3 experiments/overlay-region-binding/apply_fix.py
      - name: Commit candidate fix
        run: |
          if ! git diff --quiet -- crates/plaid-core/src/program.rs; then
            git config user.name "plaid-research-worker"
            git config user.email "plaid-research-worker@users.noreply.github.com"
            git add crates/plaid-core/src/program.rs
            git commit -m "fix: bind regions to exact overlay descriptors"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Toolchain components
        run: rustup component add rustfmt clippy
      - name: Focused regression
        run: cargo test --locked -p plaid-core --test overlay_region_binding
      - name: Full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
