name: Research D-cache writeback lineage

on:
  push:
    branches:
      - research/dcache-writeback-lineage-gpt56sol
  workflow_dispatch:

jobs:
  exact-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned ares
        run: |
          mkdir -p .refs
          git clone https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares checkout 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares diff --quiet HEAD
      - name: Syntax-check research scripts
        run: python3 -m py_compile spikes/034-ares-dcache-writeback-lineage/model.py spikes/034-ares-dcache-writeback-lineage/run.py
      - name: Run deterministic verifier model twice
        run: |
          python3 spikes/034-ares-dcache-writeback-lineage/model.py | tee /tmp/model-a.txt
          python3 spikes/034-ares-dcache-writeback-lineage/model.py > /tmp/model-b.txt
          cmp /tmp/model-a.txt /tmp/model-b.txt
      - name: Build and execute pinned ares fixture
        run: python3 spikes/034-ares-dcache-writeback-lineage/run.py
