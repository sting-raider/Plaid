name: research-sw-interrupt-producer

on:
  push:
    branches:
      - research/sw-interrupt-producer-gpt56sol
  workflow_dispatch:

jobs:
  sw-interrupt-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git clone --filter=blob:none --no-checkout https://github.com/gopher64/gopher64.git .refs/gopher64
          git -C .refs/gopher64 fetch origin e96debac941a26ba4961e5145056c0821d3a56f7
          git -C .refs/gopher64 checkout --detach e96debac941a26ba4961e5145056c0821d3a56f7
          git clone --filter=blob:none --no-checkout https://github.com/mupen64plus/mupen64plus-core.git .refs/mupen64plus-core
          git -C .refs/mupen64plus-core fetch origin ba95bab92a76744753bfe61470823a4937850ab0
          git -C .refs/mupen64plus-core checkout --detach ba95bab92a76744753bfe61470823a4937850ab0

      - name: Guard exact source contracts
        run: python3 experiments/ares-sw-interrupt-producer/source_guard.py

      - name: Syntax-check research scripts
        run: python3 -m py_compile experiments/ares-sw-interrupt-producer/model.py experiments/ares-sw-interrupt-producer/run.py experiments/ares-sw-interrupt-producer/source_guard.py

      - name: Exhaustive ownership model
        run: python3 experiments/ares-sw-interrupt-producer/model.py

      - name: Build and execute exact-reference guest matrix
        run: python3 experiments/ares-sw-interrupt-producer/run.py

      - name: Hash durable result payloads
        run: sha256sum target/ares-sw-interrupt-producer/model.json target/ares-sw-interrupt-producer/results.json

      - name: Upload exact result payloads
        uses: actions/upload-artifact@v4
        with:
          name: sw-interrupt-producer-results
          path: |
            target/ares-sw-interrupt-producer/model.json
            target/ares-sw-interrupt-producer/results.json
