name: research-indirect-source-unit

on:
  push:
    branches:
      - research/indirect-source-unit-binding-gpt56sol
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused adversarial matrix
        run: cargo test -p plaid-core --test indirect_source_unit_binding -- --nocapture
      - name: Full plaid-core suite
        run: cargo test -p plaid-core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
