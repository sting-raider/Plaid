name: Direct integration reproduce n64sym evidence

on:
  push:
    branches:
      - direct-integration/n64sym-candidates-gpt56sol
    paths:
      - '.github/workflows/direct-n64sym-repro.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove production source is unchanged from claimed main
        shell: bash
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 9154b30b12026c8c122f654d7fe90f0f67968dce HEAD
          git diff --exit-code 9154b30b12026c8c122f654d7fe90f0f67968dce -- crates/plaid-core/src crates/plaid-core/tests
      - name: Materialize validated research experiment only for this run
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin 129b805e5ec6895c1f426bf610a8a776d8c7d991
          git archive FETCH_HEAD experiments/n64sym-signature-evidence | tar -x
      - name: Install exact experiment prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu
      - name: Reproduce exact-pinned n64sym ambiguity and relocation normalization
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile experiments/n64sym-signature-evidence/run.py
          python3 experiments/n64sym-signature-evidence/run.py --report target/direct-n64sym-report.json | tee target/direct-n64sym-run.log
          test "$(sha256sum target/direct-n64sym-report.json | cut -d' ' -f1)" = "fb47b856cb299d801455c1c466ed626fde0c1b2c308d3b6d3ebdca54f9d2dabb"
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-n64sym-reproduction
          if-no-files-found: warn
          path: |
            target/direct-n64sym-report.json
            target/direct-n64sym-run.log
