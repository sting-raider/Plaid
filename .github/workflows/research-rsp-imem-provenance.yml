name: research-rsp-imem-provenance

on:
  push:
    branches:
      - research/rsp-imem-provenance-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          g++ --version | head -1
          python3 --version
      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch --depth=1 origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04
      - name: Build and run RSP provenance experiment
        run: python3 spikes/018-ares-rsp-imem-provenance/run.py
      - name: Hash generated observer sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          root = Path.cwd()
          out = root / "target/ares-rsp-imem-provenance-spike/traced-build"
          files = [
              out / "include/n64/rdram/rdram.hpp",
              out / "rsp_dma.cpp",
              out / "rsp_io.cpp",
              out / "rsp.cpp",
              out / "n64.cpp",
          ]
          record = {
              "plaid_head": os.environ["GITHUB_SHA"],
              "ares_revision": "9408cb43d4948fc3ea6e152a307a34348df3fe04",
              "compiler": subprocess.check_output(["g++", "--version"], text=True).splitlines()[0],
              "python": subprocess.check_output(["python3", "--version"], text=True).strip(),
              "driver_sha256": hashlib.sha256((root / "spikes/018-ares-rsp-imem-provenance/driver.cpp").read_bytes()).hexdigest(),
              "runner_sha256": hashlib.sha256((root / "spikes/018-ares-rsp-imem-provenance/run.py").read_bytes()).hexdigest(),
              "generated": {str(p.relative_to(out)): hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
          }
          (out / "observer-build.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          print(json.dumps(record, indent=2, sort_keys=True))
          PY
      - name: Confirm pinned reference stayed untouched
        run: git -C .refs/ares diff --exit-code HEAD
      - name: Upload deterministic result and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsp-imem-provenance-results
          path: |
            target/ares-rsp-imem-provenance-spike/results.json
            target/ares-rsp-imem-provenance-spike/baseline-build/build.json
            target/ares-rsp-imem-provenance-spike/baseline-build/build.log
            target/ares-rsp-imem-provenance-spike/traced-build/build.json
            target/ares-rsp-imem-provenance-spike/traced-build/observer-build.json
            target/ares-rsp-imem-provenance-spike/traced-build/build.log
            target/ares-rsp-imem-provenance-spike/traced-build/traced-build.log
          if-no-files-found: warn
