name: research-region-physical-alignment-rustfmt

on:
  push:
    branches:
      - research/region-physical-alignment-gpt56sol

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message == 'Apply physical-alignment rustfmt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name "plaid-research-worker"
          git config user.email "actions@users.noreply.github.com"
          git add crates/plaid-core/src/program.rs crates/plaid-core/tests/region_physical_alignment.rs
          git diff --cached --quiet && exit 0
          git commit -m "Format physical alignment regression"
          git push origin HEAD:research/region-physical-alignment-gpt56sol
