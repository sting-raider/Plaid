name: Research history scalability

on:
  push:
    branches: [research/history-scalability-gpt56sol]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Confirm canonical research base
        run: |
          git merge-base --is-ancestor ae41bdba82993ec8e77f47e5f9d3bb9af06f9256 HEAD
          python3 -m py_compile spikes/044-history-scalability/bench.py
      - name: Build strict consumer
        run: cargo build --release --locked -p plaid
      - name: Benchmark record and identity scaling
        run: python3 spikes/044-history-scalability/bench.py
      - name: Show durable result
        run: cat target/history-scalability/results.json
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: history-scalability-results
          path: target/history-scalability/results.json
