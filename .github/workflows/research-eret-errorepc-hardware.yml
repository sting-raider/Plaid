name: research-eret-errorepc-hardware

on:
  push:
    branches:
      - research/eret-errorepc-hardware-gpt56sol
  workflow_dispatch:

jobs:
  errorepc-eret:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git clone --filter=blob:none --no-checkout https://github.com/gopher64/gopher64.git .refs/gopher64
          git -C .refs/gopher64 fetch origin e96debac941a26ba4961e5145056c0821d3a56f7
          git -C .refs/gopher64 checkout --detach e96debac941a26ba4961e5145056c0821d3a56f7
          git clone --filter=blob:none --no-checkout https://github.com/mupen64plus/mupen64plus-core.git .refs/mupen64plus-core
          git -C .refs/mupen64plus-core fetch origin ba95bab92a76744753bfe61470823a4937850ab0
          git -C .refs/mupen64plus-core checkout --detach ba95bab92a76744753bfe61470823a4937850ab0
          git clone --filter=blob:none --no-checkout https://github.com/lemmy-64/n64-systemtest.git .refs/n64-systemtest
          git -C .refs/n64-systemtest fetch origin 196f5421173220eb2f63a7a99c64795dc0ea0698
          git -C .refs/n64-systemtest checkout --detach 196f5421173220eb2f63a7a99c64795dc0ea0698

      - name: Syntax and adversarial model
        run: |
          python3 -m py_compile experiments/eret-errorepc-hardware/model.py experiments/eret-errorepc-hardware/run.py experiments/eret-errorepc-hardware/source_guard.py
          mkdir -p target/eret-errorepc-hardware
          python3 experiments/eret-errorepc-hardware/model.py | tee target/eret-errorepc-hardware/model.txt

      - name: Guard exact source disagreement
        run: |
          python3 experiments/eret-errorepc-hardware/source_guard.py \
            --ares .refs/ares \
            --gopher64 .refs/gopher64 \
            --mupen .refs/mupen64plus-core \
            --systemtest .refs/n64-systemtest \
            --out target/eret-errorepc-hardware/source_guard.json

      - name: Build and execute exact ares matrix
        run: python3 experiments/eret-errorepc-hardware/run.py

      - name: Hash receipts
        run: |
          sha256sum target/eret-errorepc-hardware/results.json target/eret-errorepc-hardware/source_guard.json target/eret-errorepc-hardware/model.txt
          sha256sum experiments/eret-errorepc-hardware/model.py experiments/eret-errorepc-hardware/driver.cpp experiments/eret-errorepc-hardware/run.py experiments/eret-errorepc-hardware/source_guard.py

      - name: Retain evidence
        uses: actions/upload-artifact@v4
        with:
          name: eret-errorepc-hardware-evidence
          path: target/eret-errorepc-hardware/
