name: research-watch-exception-roots

on:
  push:
    branches:
      - research/watch-exception-roots-gpt56sol
  workflow_dispatch:

jobs:
  watch-root-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git clone --filter=blob:none --no-checkout https://github.com/gopher64/gopher64.git .refs/gopher64
          git -C .refs/gopher64 fetch origin e96debac941a26ba4961e5145056c0821d3a56f7
          git -C .refs/gopher64 checkout --detach e96debac941a26ba4961e5145056c0821d3a56f7
          git clone --filter=blob:none --no-checkout https://github.com/mupen64plus/mupen64plus-core.git .refs/mupen64plus-core
          git -C .refs/mupen64plus-core fetch origin ba95bab92a76744753bfe61470823a4937850ab0
          git -C .refs/mupen64plus-core checkout --detach ba95bab92a76744753bfe61470823a4937850ab0
          git clone --filter=blob:none --no-checkout https://github.com/lemmy-64/n64-systemtest.git .refs/n64-systemtest
          git -C .refs/n64-systemtest fetch origin 196f5421173220eb2f63a7a99c64795dc0ea0698
          git -C .refs/n64-systemtest checkout --detach 196f5421173220eb2f63a7a99c64795dc0ea0698

      - name: Run adversarial certificate model
        run: python3 experiments/watch-exception-roots-gpt56sol/model.py | tee target-watch-model.log

      - name: Guard exact source contracts
        run: python3 experiments/watch-exception-roots-gpt56sol/source_guard.py

      - name: Syntax-check runner
        run: python3 -m py_compile experiments/watch-exception-roots-gpt56sol/model.py experiments/watch-exception-roots-gpt56sol/source_guard.py experiments/watch-exception-roots-gpt56sol/run.py

      - name: Build and execute exact pinned ares matrix
        run: python3 experiments/watch-exception-roots-gpt56sol/run.py | tee target-watch-run.log

      - name: Hash evidence
        run: |
          sha256sum target/ares-watch-exception-roots/results.json
          sha256sum target/ares-watch-exception-roots/source_guard.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: watch-exception-root-results
          path: |
            target/ares-watch-exception-roots/results.json
            target/ares-watch-exception-roots/source_guard.json
            target-watch-model.log
            target-watch-run.log
