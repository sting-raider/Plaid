name: Direct format RSP DMEM egress

on:
  push:
    branches:
      - direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
    paths:
      - 'crates/plaid-core/src/rsp_dmem_dma_egress.rs'
      - '.github/workflows/direct-format-rsp-dmem-egress.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
      - name: Install repository toolchain
        run: rustup show
      - name: Apply rustfmt exactly
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "Plaid Direct Integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git add crates/plaid-core/src/rsp_dmem_dma_egress.rs
          git commit -m "Format RSP DMEM DMA egress replay"
          git push origin HEAD:direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
