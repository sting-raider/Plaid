name: Direct final validate RSP DMEM egress

on:
  push:
    branches:
      - direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
    paths:
      - '.github/workflows/direct-final-validate-rsp-dmem-egress.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
          fetch-depth: 1
      - name: Rehydrate immutable research fixture
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --depth=1 origin b02d281624e4b077709a6255c569bbb25f8ef486
          git checkout FETCH_HEAD -- spikes/043-ares-rsp-dmem-dma-egress
      - name: Reproduce exact pinned ares evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git init .refs/ares
          git -C .refs/ares remote add origin https://github.com/ares-emulator/ares.git
          git -C .refs/ares fetch --depth=1 origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          python3 -m py_compile spikes/043-ares-rsp-dmem-dma-egress/run.py spikes/043-ares-rsp-dmem-dma-egress/verify.py spikes/043-ares-rsp-dmem-dma-egress/source_guard.py
          python3 spikes/043-ares-rsp-dmem-dma-egress/source_guard.py
          mkdir -p target
          python3 spikes/043-ares-rsp-dmem-dma-egress/run.py | tee target/rsp-dmem-dma-egress-final.log
          sha256sum target/ares-rsp-dmem-dma-egress/results.json
      - name: Restore production tree
        run: |
          git reset --hard HEAD
          git clean -fd spikes/043-ares-rsp-dmem-dma-egress
      - name: Focused DMEM egress regressions
        run: cargo test --locked -p plaid-core rsp_dmem_dma_egress
      - name: Required formatting gate
        run: cargo fmt --all -- --check
      - name: Required strict Clippy gate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Required full workspace gate
        run: cargo test --locked --workspace
      - name: Upload exact-pin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsp-dmem-egress-final-validation
          if-no-files-found: warn
          path: |
            target/ares-rsp-dmem-dma-egress/results.json
            target/rsp-dmem-dma-egress-final.log
