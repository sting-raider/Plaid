name: Research solver overlapping CodeImage source

on:
  push:
    branches:
      - research/solver-overlapping-codeimage-source-gpt56sol
  workflow_dispatch:

# Branch-only research evidence. Never merged as a production requirement.
permissions:
  contents: write

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and exact decoder pin
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          rustup component add rustfmt clippy
          grep -F 'rev = "724a49a5b4dbfb99f1a9e6992e63964fd29c90c8"' crates/plaid-core/Cargo.toml
          grep -F 'rev = "724a49a5b4dbfb99f1a9e6992e63964fd29c90c8"' refs.lock.toml
      - name: Apply idempotent candidate fix in checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/plaid-core/src/solver.rs")
          text = path.read_text()
          marker = '"conflicting_instruction_sources"'
          if marker in text:
              print("candidate fix already present")
              raise SystemExit(0)

          needle = "    let starts: BTreeSet<_> = map\n"
          assert text.count(needle) == 1, "solver insertion point changed"
          insert = '''    // A partitioned proof source cannot assign two different words to one
          // execution identity. Check every supplied word independently of CFG roots
          // so an interior fragment cannot evade source() at a block start.
          for image in images {
              for offset in (0..image.size()?).step_by(4) {
                  let pc = crate::GuestAddr(image.base.pc.0 + offset);
                  let mut words = images
                      .iter()
                      .filter(|candidate| {
                          candidate.base.image == image.base.image
                              && candidate.base.generation == image.base.generation
                      })
                      .filter_map(|candidate| candidate.word(pc));
                  let first = words.next().expect("current image covers its own word");
                  if words.any(|word| word != first) {
                      let site = image.address(pc);
                      let evidence = map
                          .regions
                          .iter()
                          .filter(|region| {
                              region.image == site.image
                                  && region.generation == site.generation
                                  && region.range.contains(site.pc)
                          })
                          .flat_map(|region| region.evidence.iter().cloned())
                          .collect();
                      add(
                          "conflicting_instruction_sources",
                          Some(site),
                          "supplied CodeImage fragments disagree on bytes for one execution identity",
                          evidence,
                      );
                  }
              }
          }
          '''
          path.write_text(text.replace(needle, insert + needle, 1))
          PY
          cargo fmt --all
      - name: Format
        run: cargo fmt --all -- --check
      - name: Overlapping-source adversarial matrix
        run: cargo test -p plaid-core --test solver_overlapping_codeimage_source -- --nocapture
      - name: Full plaid-core tests
        run: cargo test -p plaid-core
      - name: Clippy
        run: cargo clippy -p plaid-core --tests -- -D warnings
      - name: Persist candidate fix on research branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/plaid-core/src/solver.rs; then
            echo "solver candidate already committed"
            exit 0
          fi
          git config user.name "Plaid research worker"
          git config user.email "actions@users.noreply.github.com"
          git add crates/plaid-core/src/solver.rs
          git commit -m "fix: reject conflicting overlapping instruction sources"
          git push origin HEAD:research/solver-overlapping-codeimage-source-gpt56sol
