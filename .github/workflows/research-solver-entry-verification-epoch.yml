name: research-solver-entry-verification-epoch

on:
  push:
    branches:
      - research/solver-entry-verification-epoch-gpt56sol
  workflow_dispatch:

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run entry-verification epoch regression
        run: cargo test -p plaid-core --test solver_entry_verification_epoch -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test -p plaid-core
