name: Research RSP self-store IMEM isolation

on:
  push:
    branches: [research/rsp-self-store-imem-gpt56sol]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - uses: actions/checkout@v4
        with:
          repository: gopher64/gopher64
          ref: e96debac941a26ba4961e5145056c0821d3a56f7
          path: .refs/gopher64
      - uses: actions/checkout@v4
        with:
          repository: lemmy-64/n64-systemtest
          ref: 196f5421173220eb2f63a7a99c64795dc0ea0698
          path: .refs/n64-systemtest
      - name: Syntax-check verifier
        run: python3 -m py_compile spikes/026-ares-rsp-self-stores/run.py
      - name: Audit pinned references and execute exact pinned ares
        shell: bash
        run: |
          set +e
          python3 spikes/026-ares-rsp-self-stores/run.py
          status=$?
          if [ "$status" -ne 0 ] && [ -f target/ares-rsp-self-store-spike/build/build.log ]; then
            echo '--- exact-pin build.log ---'
            cat target/ares-rsp-self-store-spike/build/build.log
          fi
          exit "$status"
      - name: Retain deterministic result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rsp-self-store-results
          path: target/ares-rsp-self-store-spike/results.json
