name: research-si-interrupt-root-compose

on:
  push:
    branches:
      - research/si-interrupt-root-compose-gpt56sol
  workflow_dispatch:

jobs:
  si-interrupt-root-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git clone --filter=blob:none --no-checkout https://github.com/gopher64/gopher64.git .refs/gopher64
          git -C .refs/gopher64 fetch origin e96debac941a26ba4961e5145056c0821d3a56f7
          git -C .refs/gopher64 checkout --detach e96debac941a26ba4961e5145056c0821d3a56f7
          test "$(git -C .refs/gopher64 rev-parse HEAD)" = e96debac941a26ba4961e5145056c0821d3a56f7

      - name: Guard exact SI/MI/CPU source contracts
        run: python3 experiments/si-interrupt-root-compose/source_guard.py

      - name: Syntax-check causal replay and runner
        run: python3 -m py_compile experiments/si-interrupt-root-compose/model.py experiments/si-interrupt-root-compose/run.py

      - name: Run adversarial causal replay
        shell: bash
        run: |
          set -o pipefail
          python3 experiments/si-interrupt-root-compose/model.py | tee target-si-model.log

      - name: Build and execute exact-reference matrix
        shell: bash
        run: |
          set -o pipefail
          python3 experiments/si-interrupt-root-compose/run.py | tee target-si-run.log

      - name: Hash durable evidence
        run: |
          set -euxo pipefail
          sha256sum target/si-interrupt-root-compose/results.json target-si-model.log target-si-run.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: si-interrupt-root-compose-evidence
          path: |
            target/si-interrupt-root-compose/results.json
            target-si-model.log
            target-si-run.log
