name: Direct COP1 lineage reproduction

on:
  push:
    branches:
      - direct-integration/cop1-lineage-gpt56sol-direct-cop1-lineage-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve current integration base
        run: |
          test "$(git merge-base 6b53a15c4c6eaadc8e0d002dd6818c600ebf2a7d HEAD)" = "6b53a15c4c6eaadc8e0d002dd6818c600ebf2a7d"
          echo "current_head=$(git rev-parse HEAD)"
      - name: Materialize only the validated research harness
        run: |
          git fetch origin a9e907d4b11b0b8478a2b1382779d04955c48d37
          git checkout a9e907d4b11b0b8478a2b1382779d04955c48d37 -- spikes/043-ares-cop1-load-store-lineage
          test "$(git rev-parse HEAD)" != "a9e907d4b11b0b8478a2b1382779d04955c48d37"
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Reproduce exact source guards and pure lineage model
        run: |
          python3 -m py_compile spikes/043-ares-cop1-load-store-lineage/lineage.py spikes/043-ares-cop1-load-store-lineage/source_guard.py spikes/043-ares-cop1-load-store-lineage/run.py
          python3 spikes/043-ares-cop1-load-store-lineage/source_guard.py
          python3 spikes/043-ares-cop1-load-store-lineage/lineage.py
      - name: Rebuild exact pinned ares and run decoded COP1 matrix
        run: python3 spikes/043-ares-cop1-load-store-lineage/run.py
