name: research-interrupt-roots

on:
  push:
    branches:
      - research/interrupt-roots-gpt56sol-20261009
  workflow_dispatch:

jobs:
  interrupt-root-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git clone --filter=blob:none --no-checkout https://github.com/gopher64/gopher64.git .refs/gopher64
          git -C .refs/gopher64 fetch origin e96debac941a26ba4961e5145056c0821d3a56f7
          git -C .refs/gopher64 checkout --detach e96debac941a26ba4961e5145056c0821d3a56f7
          test "$(git -C .refs/gopher64 rev-parse HEAD)" = e96debac941a26ba4961e5145056c0821d3a56f7

      - name: Guard exact source contracts
        run: python3 experiments/ares-interrupt-roots-gpt56sol/source_guard.py

      - name: Syntax-check runner
        run: python3 -m py_compile experiments/ares-interrupt-roots-gpt56sol/run.py

      - name: Build and execute exact-reference matrix
        run: python3 experiments/ares-interrupt-roots-gpt56sol/run.py

      - name: Hash durable result payload
        run: sha256sum target/ares-interrupt-roots/results.json

      - name: Upload exact result payload
        uses: actions/upload-artifact@v4
        with:
          name: interrupt-root-results
          path: target/ares-interrupt-roots/results.json
