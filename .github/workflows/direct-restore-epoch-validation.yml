name: direct-restore-epoch-validation

on:
  push:
    branches:
      - direct-integration/restore-epoch-gpt56sol-direct-restore-epoch-20261011-a7

jobs:
  exact-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile validation tree with current main
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          echo "validation_main=$(git rev-parse origin/main)"
          git -c user.name=plaid-validation -c user.email=validation@invalid.local merge --no-edit origin/main

      - name: Restore validated reproducer from research branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin research/savestate-tlb-cache-epoch-gpt56sol
          git restore --source=FETCH_HEAD -- experiments/savestate-tlb-cache-epoch

      - name: Fetch exact pinned ares
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check and adversarial model
        run: |
          python3 -m py_compile experiments/savestate-tlb-cache-epoch/model.py experiments/savestate-tlb-cache-epoch/source_guard.py experiments/savestate-tlb-cache-epoch/run.py
          python3 experiments/savestate-tlb-cache-epoch/model.py

      - name: Guard exact source contract
        run: python3 experiments/savestate-tlb-cache-epoch/source_guard.py

      - name: Build and execute exact-reference fixture
        run: python3 experiments/savestate-tlb-cache-epoch/run.py

      - name: Hash durable result payload
        run: sha256sum target/ares-savestate-tlb-cache-epoch/results.json

      - name: Upload exact result payload
        uses: actions/upload-artifact@v4
        with:
          name: direct-restore-epoch-results
          path: target/ares-savestate-tlb-cache-epoch/results.json
