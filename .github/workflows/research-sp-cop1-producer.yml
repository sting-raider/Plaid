name: Research SP COP1 producer lineage

on:
  push:
    branches: [research/sp-cop1-producer-gpt56sol]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Check exact pinned source and Python verifier
        run: |
          python3 -m py_compile spikes/043-ares-sp-cop1-producer/source_guard.py spikes/043-ares-sp-cop1-producer/verify.py spikes/043-ares-sp-cop1-producer/run.py
          python3 spikes/043-ares-sp-cop1-producer/source_guard.py
      - name: Build exact pinned ares and run decoded SWC1 SP matrix
        run: python3 spikes/043-ares-sp-cop1-producer/run.py
      - name: Print harness build logs on failure
        if: failure()
        run: |
          find target/ares-sp-cop1-producer -name build.log -print -exec tail -n 160 {} \; || true
