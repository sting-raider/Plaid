name: Research D-cache eviction lineage

on:
  push:
    branches: [research/dcache-eviction-lineage-gpt56sol]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Check deterministic provenance model
        run: |
          python3 -m py_compile spikes/036-ares-dcache-eviction-lineage/model.py spikes/036-ares-dcache-eviction-lineage/run.py
          python3 spikes/036-ares-dcache-eviction-lineage/model.py
      - name: Build exact pinned ares and test dirty replacement writeback
        run: python3 spikes/036-ares-dcache-eviction-lineage/run.py
