name: Direct CPU mutation reproduction

on:
  pull_request:
    paths:
      - "crates/plaid-core/src/cpu_mutation.rs"
      - "crates/plaid-core/src/lib.rs"
      - "spikes/035-ares-cop1-stores/**"
      - ".github/workflows/direct-cpu-mutation-repro.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Run independent payload-selection model
        run: |
          python3 -m py_compile spikes/035-ares-cop1-stores/model.py spikes/035-ares-cop1-stores/run.py
          python3 spikes/035-ares-cop1-stores/model.py
      - name: Build exact pinned ares and run COP1 store matrix
        run: python3 spikes/035-ares-cop1-stores/run.py
