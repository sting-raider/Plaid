name: Direct n64sym candidate validation

on:
  pull_request:
    paths:
      - 'crates/plaid-core/src/signature_evidence.rs'
      - 'crates/plaid-core/src/lib.rs'
      - 'crates/plaid-core/tests/signature_evidence.rs'
      - '.github/workflows/direct-n64sym-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated research experiment
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin 129b805e5ec6895c1f426bf610a8a776d8c7d991
          git archive FETCH_HEAD experiments/n64sym-signature-evidence | tar -x
      - name: Install exact experiment prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu
      - name: Reproduce exact-pinned ambiguity and relocation normalization
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p target
          python3 -m py_compile experiments/n64sym-signature-evidence/run.py
          python3 experiments/n64sym-signature-evidence/run.py --report target/direct-n64sym-report.json | tee target/direct-n64sym-run.log
          test "$(sha256sum target/direct-n64sym-report.json | cut -d' ' -f1)" = "fb47b856cb299d801455c1c466ed626fde0c1b2c308d3b6d3ebdca54f9d2dabb"
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-n64sym-candidate-reproduction
          if-no-files-found: warn
          path: |
            target/direct-n64sym-report.json
            target/direct-n64sym-run.log

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused signature evidence tests
        run: cargo test --locked -p plaid-core signature_evidence
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
