name: research-solver-raw-store-closure

on:
  push:
    branches:
      - research/solver-raw-store-closure-gpt56sol
  workflow_dispatch:

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run adversarial solver regression
        run: cargo test -p plaid-core --test solver_raw_store -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test -p plaid-core
