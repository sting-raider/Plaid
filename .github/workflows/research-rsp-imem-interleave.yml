name: Research RSP IMEM interleave

on:
  workflow_dispatch:
  push:
    branches:
      - research/rsp-imem-interleave-gpt56sol
    paths:
      - 'spikes/043-ares-rsp-imem-interleave/**'
      - '.github/workflows/research-rsp-imem-interleave.yml'

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned ares
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git init .refs/ares
          git -C .refs/ares remote add origin https://github.com/ares-emulator/ares.git
          git -C .refs/ares fetch --depth=1 origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
      - name: Syntax and model checks
        run: |
          python3 -m py_compile spikes/043-ares-rsp-imem-interleave/model.py spikes/043-ares-rsp-imem-interleave/source_guard.py spikes/043-ares-rsp-imem-interleave/run.py
          python3 spikes/043-ares-rsp-imem-interleave/model.py
          python3 spikes/043-ares-rsp-imem-interleave/source_guard.py .refs/ares
      - name: Execute exact-pin experiment
        run: |
          set -o pipefail
          mkdir -p target
          python3 spikes/043-ares-rsp-imem-interleave/run.py | tee target/rsp-imem-interleave-run.log
          sha256sum target/ares-rsp-imem-interleave/results.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsp-imem-interleave-evidence
          if-no-files-found: warn
          path: |
            target/ares-rsp-imem-interleave/results.json
            target/rsp-imem-interleave-run.log
            target/ares-rsp-imem-interleave/build/build.log
