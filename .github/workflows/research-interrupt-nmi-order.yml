name: research-interrupt-nmi-order
on:
  push:
    branches: [research/interrupt-nmi-order-gpt56sol]
  workflow_dispatch:
jobs:
  exact-pin-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git clone --filter=blob:none --no-checkout https://github.com/gopher64/gopher64.git .refs/gopher64
          git -C .refs/gopher64 fetch origin e96debac941a26ba4961e5145056c0821d3a56f7
          git -C .refs/gopher64 checkout --detach e96debac941a26ba4961e5145056c0821d3a56f7
          git clone --filter=blob:none --no-checkout https://github.com/mupen64plus/mupen64plus-core.git .refs/mupen64plus-core
          git -C .refs/mupen64plus-core fetch origin ba95bab92a76744753bfe61470823a4937850ab0
          git -C .refs/mupen64plus-core checkout --detach ba95bab92a76744753bfe61470823a4937850ab0
      - name: Syntax and adversarial model
        run: |
          python3 -m py_compile experiments/interrupt-nmi-order-gpt56sol/{model.py,source_guard.py,run.py}
          python3 experiments/interrupt-nmi-order-gpt56sol/model.py
      - name: Exact source guards
        run: python3 experiments/interrupt-nmi-order-gpt56sol/source_guard.py
      - name: Build baseline and fetch-observed exact ares matrices
        shell: bash
        run: |
          set +e
          python3 experiments/interrupt-nmi-order-gpt56sol/run.py
          rc=$?
          if [ $rc -ne 0 ]; then
            find target/interrupt-nmi-order-gpt56sol -name build.log -print -exec cat {} \; || true
            exit $rc
          fi
      - name: Hash evidence
        run: |
          sha256sum target/interrupt-nmi-order-gpt56sol/results.json target/interrupt-nmi-order-gpt56sol/source_guard.json experiments/interrupt-nmi-order-gpt56sol/model-results.json
      - name: Retain evidence
        uses: actions/upload-artifact@v4
        with:
          name: interrupt-nmi-order-evidence
          path: |
            target/interrupt-nmi-order-gpt56sol/results.json
            target/interrupt-nmi-order-gpt56sol/source_guard.json
            experiments/interrupt-nmi-order-gpt56sol/model-results.json
