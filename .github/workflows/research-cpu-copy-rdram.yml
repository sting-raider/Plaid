name: research-cpu-copy-rdram

on:
  push:
    branches:
      - research/cpu-copy-rdram-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = "9408cb43d4948fc3ea6e152a307a34348df3fe04"
      - name: Run CPU-copy transaction experiment
        run: python3 spikes/020-ares-cpu-copy-transactions/run.py
      - name: Upload reproducibility outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-copy-rdram-results
          path: |
            target/ares-cpu-copy-transactions-spike/results.json
            target/ares-cpu-copy-transactions-spike/instrumented/build.json
            target/ares-cpu-copy-transactions-spike/instrumented/build.log
            target/ares-cpu-copy-transactions-spike/baseline/build.json
            target/ares-cpu-copy-transactions-spike/baseline/build.log
          if-no-files-found: warn
