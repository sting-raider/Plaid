name: research-solver-supplied-image-provenance

on:
  push:
    branches:
      - research/solver-supplied-image-provenance-gpt56sol
  workflow_dispatch:

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run supplied-image provenance regression
        run: cargo test -p plaid-core --test solver_supplied_image_provenance -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test -p plaid-core
      - name: Run clippy
        run: cargo clippy -p plaid-core --all-targets -- -D warnings
