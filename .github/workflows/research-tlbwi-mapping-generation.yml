name: research-tlbwi-mapping-generation

on:
  push:
    branches:
      - research/tlbwi-mapping-generation-gpt56sol
  workflow_dispatch:

jobs:
  tlbwi-generation-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check and adversarial model
        run: |
          python3 -m py_compile spikes/045-ares-tlbwi-mapping-generation/run.py spikes/045-ares-tlbwi-mapping-generation/source_guard.py spikes/045-ares-tlbwi-mapping-generation/model.py
          python3 spikes/045-ares-tlbwi-mapping-generation/model.py

      - name: Guard exact source contract
        run: python3 spikes/045-ares-tlbwi-mapping-generation/source_guard.py

      - name: Build and execute exact-reference matrix
        run: python3 spikes/045-ares-tlbwi-mapping-generation/run.py

      - name: Hash durable result payload
        run: sha256sum target/ares-tlbwi-mapping-generation/results.json

      - name: Upload exact result payload
        uses: actions/upload-artifact@v4
        with:
          name: tlbwi-mapping-generation-results
          path: target/ares-tlbwi-mapping-generation/results.json
