name: research-apply-entry-verification-candidate

on:
  push:
    branches:
      - research/entry-verification-source-unit-binding-gpt56sol

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply narrow candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          program = Path('crates/plaid-core/src/program.rs')
          text = program.read_text()
          old = '''        for verification in &self.entry_verifications {
              address(&verification.entry)?;
              refs(&verification.evidence)?;
              if !self.entries.contains_key(&verification.entry)
                  || !self
                      .evidence
                      .get(&verification.source_unit)
                      .is_some_and(|e| e.kind == EvidenceKind::Trace)
              {
                  return Err("verified entry missing installed identity or unit provenance".into());
              }
          }
          '''
          # Correct the indentation above to exactly match Rust source.
          old = old.replace('              ', '            ').replace('          }\n          ', '        }\n')
          new = '''        for verification in &self.entry_verifications {
            address(&verification.entry)?;
            refs(&verification.evidence)?;
            let source_unit_region = self.regions.iter().any(|region| {
                region.image == verification.entry.image
                    && region.generation == verification.entry.generation
                    && region.range.contains(verification.entry.pc)
                    && region.evidence.contains(&verification.source_unit)
            });
            if !self.entries.contains_key(&verification.entry)
                || !self
                    .evidence
                    .get(&verification.source_unit)
                    .is_some_and(|e| e.kind == EvidenceKind::Trace)
                || !source_unit_region
            {
                return Err("verified entry missing installed identity or unit provenance".into());
            }
        }
'''
          if 'let source_unit_region = self.regions.iter().any' not in text:
              if old not in text:
                  raise SystemExit('program.rs candidate anchor not found')
              program.write_text(text.replace(old, new, 1))

          test = Path('crates/plaid-core/tests/entry_verification_source_unit.rs')
          text = test.read_text()
          old = '''    // Reproduction on current main-derived ProgramMap validation.
    assert!(forged.validate().is_ok());
    // The smallest structural candidate does catch this easy substitution.
    assert!(!candidate_region_binding(&forged));
'''
          new = '''    // The production candidate catches the easy substitution.
    assert!(forged.validate().is_err());
    assert!(!candidate_region_binding(&forged));
'''
          if old in text:
              test.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('test candidate anchor not found')
          PY
      - name: Focused candidate matrix
        run: cargo test -p plaid-core --test entry_verification_source_unit -- --nocapture
      - name: Full plaid-core regression
        run: cargo test -p plaid-core
      - name: Commit candidate
        shell: bash
        run: |
          git add crates/plaid-core/src/program.rs crates/plaid-core/tests/entry_verification_source_unit.rs
          if git diff --cached --quiet; then
            echo 'candidate already applied; nothing to commit'
            exit 0
          fi
          git config user.name 'Plaid Research Worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'research: candidate region-bind entry verification source unit [candidate-applied]'
          git push origin HEAD:research/entry-verification-source-unit-binding-gpt56sol
