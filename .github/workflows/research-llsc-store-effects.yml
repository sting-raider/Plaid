name: Research LL/SC storage effects

on:
  push:
    branches: [research/llsc-store-effects-gpt56sol]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Syntax-check verifier
        run: python3 -m py_compile spikes/043-ares-llsc-store-effects/run.py
      - name: Build and execute exact pinned ares fixture
        shell: bash
        run: |
          set +e
          python3 spikes/043-ares-llsc-store-effects/run.py | tee llsc-run.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            find target/ares-llsc-store-effects -name build.log -print -exec tail -80 {} \; || true
          fi
          exit "$status"
      - name: Retain deterministic evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llsc-store-effects-results
          path: |
            target/ares-llsc-store-effects/results.json
            llsc-run.txt
