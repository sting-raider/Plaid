name: research-rdram-uncached-fetch

on:
  push:
    branches:
      - research/ares-rdram-uncached-fetch-gpt56sol
    paths:
      - 'spikes/025-ares-rdram-uncached-fetch/**'
      - '.github/workflows/research-rdram-uncached-fetch.yml'
  workflow_dispatch:

jobs:
  uncached-fetch-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check runner
        run: python3 -m py_compile spikes/025-ares-rdram-uncached-fetch/run.py

      - name: Build and execute provenance matrix
        run: python3 spikes/025-ares-rdram-uncached-fetch/run.py

      - name: Hash result payload
        run: sha256sum target/ares-rdram-uncached-fetch-spike/results.json
