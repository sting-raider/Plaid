name: Research exception root generation

on:
  push:
    branches: [research/exception-root-generation-gpt56sol]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Run adversarial root-generation reducer
        run: |
          python3 -m py_compile experiments/exception_root_generation.py spikes/044-ares-exception-root-generation/run.py
          python3 experiments/exception_root_generation.py
          python3 experiments/exception_root_generation.py
      - name: Build exact pinned ares and execute exception-root fixture
        run: python3 spikes/044-ares-exception-root-generation/run.py
