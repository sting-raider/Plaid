name: research-rdram-translated-backing

on:
  push:
    branches:
      - research/rdram-translated-backing-gpt56sol
    paths:
      - 'spikes/033-ares-rdram-translated-backing/**'
      - '.github/workflows/research-rdram-translated-backing.yml'
  workflow_dispatch:

jobs:
  translated-backing-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check runner
        run: python3 -m py_compile spikes/033-ares-rdram-translated-backing/run.py

      - name: Build and execute translated backing matrix
        run: python3 spikes/033-ares-rdram-translated-backing/run.py

      - name: Hash durable result payloads
        run: |
          sha256sum target/ares-rdram-translated-backing-spike/results.json
          sha256sum target/ares-rdram-translated-backing-spike/manifest.json
