name: direct-integration-exception-roots-docpatch

on:
  push:
    branches:
      - direct-integration/exception-roots-gpt56sol-20261011
    paths:
      - .github/workflows/direct-integration-exception-roots-docpatch.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/exception-roots-gpt56sol-20261011
          fetch-depth: 0

      - name: Append canonical integration documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; import base64; p=Path('docs/STATUS.md'); p.write_bytes(p.read_bytes()+base64.b64decode(''))"
          python3 -c "from pathlib import Path; import base64; p=Path('docs/NEXT.md'); p.write_bytes(p.read_bytes()+base64.b64decode(''))"
          python3 -c "from pathlib import Path; import base64; p=Path('docs/DECISIONS.md'); p.write_bytes(p.read_bytes()+base64.b64decode(''))"

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaid direct integration"
          git config user.email "actions@users.noreply.github.com"
          git add docs/STATUS.md docs/NEXT.md docs/DECISIONS.md
          git commit -m "[exception-root-docs] Document bounded exception root integration"
          git push origin HEAD:direct-integration/exception-roots-gpt56sol-20261011
