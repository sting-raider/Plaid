name: Direct docs RSP DMEM egress

on:
  push:
    branches:
      - direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
    paths:
      - '.github/workflows/direct-docs-rsp-dmem-egress.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
      - name: Append canonical DMEM egress state
        shell: python
        run: |
          from pathlib import Path

          status = Path('docs/STATUS.md')
          status_text = status.read_text()
          marker = 'Production now exposes bounded source-bound `rsp_dmem_dma_egress` replay'
          assert marker not in status_text
          status_text += '''\n\n- Production now exposes bounded source-bound `rsp_dmem_dma_egress` replay for\n  completed DMEM-source reverse SP-DMA Word effects (ADR-0104). Each exported\n  byte is selected from the active completed descriptor fragment before payload\n  comparison, so equal values cannot borrow a different DMEM writer. Successful\n  same-value RSP/external writes mint fresh writer generations; concrete unknown\n  writes cut only touched byte ancestry; 4-KiB DMEM wrap is replayed per byte.\n  Unobserved initial DMEM remains `Unobserved` rather than acquiring invented\n  provenance, and complete-source SHA/report reconstruction reject forged source\n  or report identity. Fresh exact-pin ares reproduction retained the validated\n  42-event / 8-DMA-effect history and all nine forged-history rejections. Complete\n  mutation census, SP request lifecycle, hardware timing, downstream RDRAM and\n  executable lifetime, IMEM-source egress, whole-ROM closure and native completeness\n  remain OPEN.\n'''
          status.write_text(status_text)

          nxt = Path('docs/NEXT.md')
          next_text = nxt.read_text()
          marker = 'Production now has bounded DMEM reverse-SP-DMA writer-lineage replay'
          assert marker not in next_text
          next_text += '''\n\nProduction now has bounded DMEM reverse-SP-DMA writer-lineage replay (ADR-0104).\nCompose it next with authenticated SP request/completion identity plus downstream\nRDRAM storage-writer and eventual executable-consumer chronology. Keep DMEM and\nIMEM bank evidence separate: the independently integrated IMEM egress primitive\ncannot be substituted for a DMEM source, and equal payloads cannot bridge them.\nUnobserved/unknown lanes stay OPEN. Complete mutation census, save/restore/reset\nchronology, aliases/cache visibility and executable lifetimes remain prerequisites\nfor whole-ROM closure; this bounded replay issues no solver or native waiver.\n'''
          nxt.write_text(next_text)

          decisions = Path('docs/DECISIONS.md')
          decisions_text = decisions.read_text()
          marker = '## ADR-0104: Reverse SP-DMA lineage follows the completed DMEM fragment, not payload equality'
          assert marker not in decisions_text
          decisions_text += '''\n\n## ADR-0104: Reverse SP-DMA lineage follows the completed DMEM fragment, not payload equality\n\nStatus: Accepted for bounded compiler-time observed-history replay, 2026-10-11.\n\nAdopt a strict source-bound DMEM writer replay for completed reverse SP-DMA Word\neffects. Derive each four-byte source from the completed descriptor fragment and\nits current PBUS/DRAM offsets before checking the copied payload. Preserve byte\nancestry separately across 4-KiB DMEM wrap. Every successful authenticated RSP\nor external write mints a new writer generation even when the bytes are unchanged;\nan observed unknown producer cuts only the lanes it writes. A separately supplied\nexternal-writer label is evidence identity, not proof of ultimate byte origin.\nInitial bytes without an authenticated writer remain `Unobserved`; equal payloads\nat another offset, bank or generation never select a source. Recheck the complete\nsupplied history under an externally trusted SHA and reconstruct the full report.\n\nThis consumer is intentionally narrower than the research fixture: it does not\ninvent an initial writer generation, authenticate the sensor's mutation census,\nprove SP request lifecycle or hardware timing/atomicity, classify every CPU/SP\nwriter, or establish downstream RDRAM/executable lifetime. IMEM-source egress is\na separate bank-specific primitive. Save/restore/reset, aliases/cache visibility,\nwhole-ROM closure and native completeness remain OPEN; no solver obligation is\nwaived. The exact pinned ares reproduction supplies behavioral evidence, not an\nupstream production dependency.\n'''
          decisions.write_text(decisions_text)
      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaid Direct Integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git add docs/STATUS.md docs/NEXT.md docs/DECISIONS.md
          git commit -m "Document bounded RSP DMEM DMA egress replay"
          git push origin HEAD:direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
