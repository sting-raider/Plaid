name: research-ebus-hidden-fetch

on:
  push:
    branches:
      - research/ebus-hidden-fetch-gpt56sol
    paths:
      - 'spikes/034-ares-ebus-hidden-fetch/**'
      - '.github/workflows/research-ebus-hidden-fetch.yml'
  workflow_dispatch:

jobs:
  ebus-hidden-fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check runner
        run: python3 -m py_compile spikes/034-ares-ebus-hidden-fetch/run.py

      - name: Execute exact HiddenRAM transform and witness matrix
        run: python3 spikes/034-ares-ebus-hidden-fetch/run.py

      - name: Hash result payload
        run: sha256sum target/ares-ebus-hidden-fetch-spike/results.json

      - name: Upload result payload
        uses: actions/upload-artifact@v4
        with:
          name: ebus-hidden-fetch-results
          path: target/ares-ebus-hidden-fetch-spike/results.json
