name: research-indirect-event-uniqueness

on:
  push:
    branches:
      - research/indirect-event-uniqueness-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply candidate fix
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'indirect trace event has conflicting semantics' crates/plaid-core/src/program.rs; then
            echo 'candidate fix already applied'
          else
            git apply --check research/indirect-event-uniqueness.patch
            git apply research/indirect-event-uniqueness.patch
          fi
          cargo fmt --all
      - name: Run raw indirect event uniqueness regression
        run: cargo test --locked -p plaid-core --test indirect_event_uniqueness -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
      - name: Commit validated candidate fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- crates/plaid-core/src/program.rs crates/plaid-core/tests/indirect_event_uniqueness.rs; then
            echo 'candidate fix and tests already committed'
            exit 0
          fi
          git config user.name 'Plaid research worker'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/plaid-core/src/program.rs crates/plaid-core/tests/indirect_event_uniqueness.rs
          git commit -m 'fix: bind raw indirect trace events to one transfer'
          git push origin HEAD:research/indirect-event-uniqueness-gpt56sol
