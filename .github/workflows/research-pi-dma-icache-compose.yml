name: Research PI DMA I-cache composition

on:
  workflow_dispatch:
  push:
    branches:
      - research/pi-dma-icache-compose-gpt56sol
    paths:
      - 'experiments/pi-dma-icache-compose/**'
      - 'research/pi-dma-icache-compose.md'
      - '.github/workflows/research-pi-dma-icache-compose.yml'

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git init .refs/ares
          git -C .refs/ares remote add origin https://github.com/ares-emulator/ares.git
          git -C .refs/ares fetch --depth=1 origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax, source guards and adversarial replay
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p target/pi-dma-icache-compose
          python3 -m py_compile \
            experiments/pi-dma-icache-compose/run.py \
            experiments/pi-dma-icache-compose/model.py \
            experiments/pi-dma-icache-compose/source_guard.py
          python3 experiments/pi-dma-icache-compose/source_guard.py --ares .refs/ares \
            | tee target/pi-dma-icache-compose/source-guard.json
          python3 experiments/pi-dma-icache-compose/model.py \
            | tee target/pi-dma-icache-compose/model1.json
          python3 experiments/pi-dma-icache-compose/model.py \
            > target/pi-dma-icache-compose/model2.json
          cmp target/pi-dma-icache-compose/model1.json target/pi-dma-icache-compose/model2.json
          sha256sum target/pi-dma-icache-compose/model1.json \
            | tee target/pi-dma-icache-compose/model.sha256

      - name: Execute exact pinned ares composition fixture
        shell: bash
        run: |
          set -euxo pipefail
          python3 experiments/pi-dma-icache-compose/run.py \
            | tee target/pi-dma-icache-compose/run.log
          sha256sum target/pi-dma-icache-compose/results.json \
            | tee target/pi-dma-icache-compose/results.sha256

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-dma-icache-compose-evidence
          if-no-files-found: error
          path: target/pi-dma-icache-compose/
