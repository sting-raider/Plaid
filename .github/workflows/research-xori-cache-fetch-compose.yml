name: Research XORI cache fetch composition

on:
  push:
    branches: [research/xori-cache-fetch-compose-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Check exact pin and scripts
        run: |
          test "$(git -C .refs/ares rev-parse HEAD)" = "9408cb43d4948fc3ea6e152a307a34348df3fe04"
          git -C .refs/ares diff --quiet HEAD
          python3 -m py_compile \
            spikes/045-ares-xori-cache-fetch-compose/model.py \
            spikes/045-ares-xori-cache-fetch-compose/run.py
      - name: Run adversarial generation replay twice
        run: |
          python3 spikes/045-ares-xori-cache-fetch-compose/model.py | tee /tmp/model-1.txt
          cp target/xori-cache-fetch-compose/model-report.json /tmp/model-report-1.json
          python3 spikes/045-ares-xori-cache-fetch-compose/model.py | tee /tmp/model-2.txt
          cmp /tmp/model-1.txt /tmp/model-2.txt
          cmp /tmp/model-report-1.json target/xori-cache-fetch-compose/model-report.json
      - name: Build exact pinned ares and execute composed fixture
        run: |
          python3 spikes/045-ares-xori-cache-fetch-compose/run.py | tee /tmp/exact.txt
          git -C .refs/ares diff --quiet HEAD
      - name: Hash evidence
        run: |
          sha256sum target/xori-cache-fetch-compose/model-report.json
          sha256sum target/ares-xori-cache-fetch-compose/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: xori-cache-fetch-compose-evidence
          path: |
            target/xori-cache-fetch-compose/model-report.json
            target/ares-xori-cache-fetch-compose/evidence.json
            /tmp/model-1.txt
            /tmp/exact.txt
