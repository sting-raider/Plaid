name: Direct refresh RSP DMEM egress

on:
  push:
    branches:
      - direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
    paths:
      - '.github/workflows/direct-refresh-rsp-dmem-egress.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
      - name: Add ADR-0105 and durable receipt
        shell: python
        run: |
          from pathlib import Path

          status = Path('docs/STATUS.md')
          s = status.read_text()
          assert 'completed DMEM-source reverse SP-DMA Word effects (ADR-0105)' not in s
          s += '''\n\n- Production now exposes bounded source-bound `rsp_dmem_dma_egress` replay for\n  completed DMEM-source reverse SP-DMA Word effects (ADR-0105). Each exported\n  byte is selected from the active completed descriptor fragment before payload\n  comparison, so equal values cannot borrow a different DMEM writer. Successful\n  same-value RSP/external writes mint fresh writer generations; concrete unknown\n  writes cut only touched byte ancestry; 4-KiB DMEM wrap is replayed per byte.\n  Unobserved initial DMEM remains `Unobserved` rather than acquiring invented\n  provenance, and complete-source SHA/report reconstruction reject forged source\n  or report identity. Fresh exact-pin ares reproduction retained the validated\n  42-event / 8-DMA-effect history and all nine forged-history rejections. Complete\n  mutation census, SP request lifecycle, hardware timing, downstream RDRAM and\n  executable lifetime, IMEM-source egress, whole-ROM closure and native completeness\n  remain OPEN.\n'''
          status.write_text(s)

          nxt = Path('docs/NEXT.md')
          n = nxt.read_text()
          assert 'bounded DMEM reverse-SP-DMA writer-lineage replay (ADR-0105)' not in n
          n += '''\n\nProduction now has bounded DMEM reverse-SP-DMA writer-lineage replay (ADR-0105).\nCompose it next with authenticated SP request/completion identity plus downstream\nRDRAM storage-writer and eventual executable-consumer chronology. Keep DMEM and\nIMEM bank evidence separate: the independently integrated IMEM egress primitive\ncannot be substituted for a DMEM source, and equal payloads cannot bridge them.\nUnobserved/unknown lanes stay OPEN. Complete mutation census, save/restore/reset\nchronology, aliases/cache visibility and executable lifetimes remain prerequisites\nfor whole-ROM closure; this bounded replay issues no solver or native waiver.\n'''
          nxt.write_text(n)

          decisions = Path('docs/DECISIONS.md')
          d = decisions.read_text()
          assert '## ADR-0105:' not in d
          d += '''\n\n## ADR-0105: Reverse SP-DMA lineage follows the completed DMEM fragment, not payload equality\n\nStatus: Accepted for bounded compiler-time observed-history replay, 2026-10-11.\n\nAdopt a strict source-bound DMEM writer replay for completed reverse SP-DMA Word\neffects. Derive each four-byte source from the completed descriptor fragment and\nits current PBUS/DRAM offsets before checking the copied payload. Preserve byte\nancestry separately across 4-KiB DMEM wrap. Every successful authenticated RSP\nor external write mints a new writer generation even when the bytes are unchanged;\nan observed unknown producer cuts only the lanes it writes. A separately supplied\nexternal-writer label is evidence identity, not proof of ultimate byte origin.\nInitial bytes without an authenticated writer remain `Unobserved`; equal payloads\nat another offset, bank or generation never select a source. Recheck the complete\nsupplied history under an externally trusted SHA and reconstruct the full report.\n\nThis consumer is intentionally narrower than the research fixture: it does not\ninvent an initial writer generation, authenticate the sensor's mutation census,\nprove SP request lifecycle or hardware timing/atomicity, classify every CPU/SP\nwriter, or establish downstream RDRAM/executable lifetime. IMEM-source egress is\na separate bank-specific primitive. Save/restore/reset, aliases/cache visibility,\nwhole-ROM closure and native completeness remain OPEN; no solver obligation is\nwaived. The exact pinned ares reproduction supplies behavioral evidence, not an\nupstream production dependency.\n'''
          decisions.write_text(d)

          receipt = Path('research/integration-receipts/20261011-rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3.md')
          receipt.parent.mkdir(parents=True, exist_ok=True)
          receipt.write_text('''# Direct integration receipt: RSP DMEM reverse-DMA egress\n\nDate: 2026-10-11\nWorker: `gpt56sol-direct-rsp-dmem-egress-20261011-c3`\nClaim base: `bbfafdee69f1d641c6325b5fc3fecb5b22bcedc5`\nFinal canonical reconciliation base: `0e0e999b626dbda3f47cfd6aa89673618ae20350`\nCluster: source-bound RSP DMEM writer ancestry through completed reverse SP-DMA effects into RDRAM\nDecision: ADR-0105\n\n## Source research\n\n- branch `research/rsp-dmem-dma-egress-gpt56sol`\n- final research head `b02d281624e4b077709a6255c569bbb25f8ef486`\n- executable evidence commit `2a395485b3828badb8e2f68178f626008da9fa61`\n- note `research/rsp-dmem-dma-egress.md`\n- fixture `spikes/043-ares-rsp-dmem-dma-egress/`\n- exact pinned ares revision `9408cb43d4948fc3ea6e152a307a34348df3fe04`\n- original exact-pin research Actions `37917520106`\n\nThe research branch was evidence, not a merge authority.\n\n## Reproduced evidence\n\nFresh exact-pin reproduction from claim-base-era main ran in Actions `38153305667`, job `114511037497`: exact ares/source guards matched; the fixture produced 42 events, 17 RSP DMEM sink effects, one CPU DMEM sink and eight completed reverse SP-DMA Word effects. Fixture attribution was 13 RSP bytes, four CPU bytes and 15 synthetic-initial bytes. All nine measured forged histories rejected; disabled/reference and repeated enabled outputs were deterministic.\n\nAfter reconciliation with the independently landed IMEM egress primitive, exact-pin plus production validation ran in Actions `38154297446`, job `114513969889`. Hashes: event `060e97a1fa347dc1b2a928852491da320040a0dcaee6bf24dd8460de2c285060`; scoped egress `4702a25853c06b1b082985076830a2e325ebc50965a68c63ce918a5065b0ac14`; trace `25248a01ac69ebb9c7f5697a0fb010f632c7a852b5310475d9a7472f9b0dd927`; result `03d5138badc899d3b19fe24401199a672db6ce2eb2e1e00957e882bff6e54274`. Evidence artifact `11708021422`, ZIP SHA-256 `25db053eefe6fc425641b25b6c5b63a52815a69398a816eb4fadda9f7d5db946`. Focused tests, fmt, strict Clippy and full workspace tests passed.\n\nMain later changed its canonical Rust workflow to manual-only at `24689113469e0a3325601d7b6fd41b4d06ecf761`. After explicit ancestry reconciliation, Actions `38154679139`, job `114515095330` reran focused DMEM tests, exact decoder pin, fmt, strict workspace Clippy, full workspace tests, CLI, all retained synthetic contracts and the fetch-summary oracle; every step passed.\n\nCanonical main then advanced to `0e0e999b626dbda3f47cfd6aa89673618ae20350` with the cached exception-root-generation integration. That integration occupied ADR-0104, so this DMEM decision was renumbered to ADR-0105 before landing. The branch was rebuilt from that canonical tree while preserving the already-tested DMEM module blob byte-for-byte (`cfe45a098f76ad3531866898b936d5cbde4deae7`). A final post-reconciliation validation run is recorded below.\n\n## Adopted invariant\n\nProduction exposes bounded source-bound replay for completed DMEM-source reverse SP-DMA Word effects. The completed DMA descriptor fragment selects the four DMEM source bytes before payload comparison; payload equality is only a consistency check and never identifies a source, bank or generation. Authenticated successful RSP or external writes mint fresh generations even for equal bytes. Concrete unknown writers cut only touched byte lanes. DMEM wrap is per byte. Unobserved initial bytes remain `Unobserved`. Full source SHA binding and full report reconstruction are required. Mutation-census, SP-lifecycle, timing, RDRAM-lifetime, executable-lifetime and native-complete flags remain false.\n\n## Rejected or superseded assumptions\n\n- No research branch was mechanically merged.\n- The fixture's synthetic initial-generation label was not promoted.\n- Equal values, final state, matching addresses, nearest writes and another bank's evidence do not recover source identity.\n- IMEM reverse-DMA evidence is not substituted for DMEM provenance.\n- Branch-only reference/format/fix/validation workflows were removed after use.\n- No CPU-to-SP census, scheduler/request-lifetime model, hardware timing claim, solver waiver or native-lowering dependency was added.\n\n## Production files changed\n\n- `crates/plaid-core/src/rsp_dmem_dma_egress.rs`\n- `crates/plaid-core/src/lib.rs`\n- `docs/STATUS.md`\n- `docs/NEXT.md`\n- `docs/DECISIONS.md`\n- this receipt\n\n`progress.json` is unchanged because this reduces evidence-model debt without completing a declared milestone.\n\n## Tests and results\n\nFocused production tests cover same-value fresh generations, equal-payload decoy sources, byte-local external/unknown overwrites, 4-KiB wrap, forged descriptor bank/source/payload/order, missing initial ancestry, and source/report receipt forgery.\n\nPre-final runs: Actions `38154297446` and `38154679139` passed the exact-pin, focused, mandatory workspace and retained synthetic/oracle gates as described above.\n\nFinal reconciliation validation: PENDING RECEIPT UPDATE BEFORE LEASE.\n\n## Limitations and remaining proof obligations\n\nThis integration does not certify completeness of the DMEM mutation sensor or whole-machine writer census; SP DMA request identity, queue lifetime, completion authenticity beyond the supplied completed effect, hardware timing/atomicity or arbitrary concurrent DMA; ultimate ancestry of `External` writers; downstream RDRAM storage-writer chronology; aliases/TLB or cache-visible executable residency; eventual executable consumption/lifetime; save/restore/reset/NMI chronology; a complete RSP executable universe; whole-ROM CLOSED; or native completeness. Missing, reordered, forged or unclassified causal edges remain rejected or UNKNOWN. Next composition is authenticated SP request/completion identity plus downstream RDRAM writer ancestry and eventual executable-consumer/lifetime evidence. No unresolved obligation may be waived.\n''')
      - name: Commit canonical refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaid Direct Integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git add docs/STATUS.md docs/NEXT.md docs/DECISIONS.md research/integration-receipts/20261011-rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3.md
          git commit -m "Document RSP DMEM egress as ADR-0105"
          git push origin HEAD:direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
