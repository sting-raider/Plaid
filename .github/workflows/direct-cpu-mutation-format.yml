name: Direct CPU mutation formatter

on:
  pull_request:
    paths:
      - "crates/plaid-core/src/cpu_mutation.rs"
      - ".github/workflows/direct-cpu-mutation-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/plaid-core/src/cpu_mutation.rs
          git commit -m "Format CPU mutation replay"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
