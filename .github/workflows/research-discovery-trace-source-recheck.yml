name: research-discovery-trace-source-recheck

on:
  push:
    branches:
      - research/discovery-trace-source-recheck-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned Rabbitizer revision
        run: grep -F '724a49a5b4dbfb99f1a9e6992e63964fd29c90c8' refs.lock.toml Cargo.lock
      - name: Run focused source-recheck regression
        run: cargo test --locked -p plaid-core --test trace_projection -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
