name: research-nmi-root-fetch-provenance

on:
  push:
    branches:
      - research/nmi-root-fetch-provenance-gpt56sol
  workflow_dispatch:

jobs:
  nmi-root-fetch-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check and run adversarial model
        run: |
          python3 -m py_compile experiments/nmi-root-fetch-provenance/model.py experiments/nmi-root-fetch-provenance/run.py
          python3 experiments/nmi-root-fetch-provenance/model.py

      - name: Build and execute exact-reference composition
        run: python3 experiments/nmi-root-fetch-provenance/run.py

      - name: Hash result and guarded sources
        run: |
          sha256sum target/nmi-root-fetch-provenance/results.json
          sha256sum .refs/ares/ares/n64/cpu/cpu.cpp .refs/ares/ares/n64/cpu/exceptions.cpp .refs/ares/ares/n64/pif/io.cpp

      - name: Retain result payload
        uses: actions/upload-artifact@v4
        with:
          name: nmi-root-fetch-provenance-results
          path: target/nmi-root-fetch-provenance/results.json
