name: research-entry-install-event-uniqueness

on:
  push:
    branches:
      - research/entry-install-event-uniqueness-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run entry install event uniqueness regression
        run: cargo test --locked -p plaid-core --test entry_install_event_uniqueness -- --nocapture
