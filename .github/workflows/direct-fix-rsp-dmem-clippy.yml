name: Direct fix RSP DMEM Clippy

on:
  push:
    branches:
      - direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
    paths:
      - '.github/workflows/direct-fix-rsp-dmem-clippy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
      - name: Apply ordinal-loop fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/plaid-core/src/rsp_dmem_dma_egress.rs')
          text = path.read_text()
          old = '''    let mut next_ordinal = 1u64;\n    let mut active: Option<ActiveRsp> = None;'''
          new = '''    let mut active: Option<ActiveRsp> = None;'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    for event in history.events {'''
          new = '''    for (next_ordinal, event) in (1u64..).zip(history.events) {'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''        next_ordinal += 1;\n\n        match event {'''
          new = '''\n        match event {'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Validate fix
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plaid Direct Integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git add crates/plaid-core/src/rsp_dmem_dma_egress.rs
          git commit -m "Fix RSP DMEM egress ordinal replay lint"
          git push origin HEAD:direct-integration/rsp-dmem-egress-gpt56sol-direct-rsp-dmem-egress-20261011-c3
