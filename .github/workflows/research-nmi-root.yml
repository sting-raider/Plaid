name: research-nmi-root

on:
  push:
    branches:
      - research/nmi-root-gpt56sol
  workflow_dispatch:

jobs:
  nmi-root-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check runner
        run: python3 -m py_compile experiments/ares-nmi-root/run.py

      - name: Build and execute NMI matrix
        run: python3 experiments/ares-nmi-root/run.py

      - name: Hash result and sources
        run: |
          sha256sum target/ares-nmi-root/results.json
          sha256sum .refs/ares/ares/n64/cpu/exceptions.cpp .refs/ares/ares/n64/cpu/cpu.cpp .refs/ares/ares/n64/cpu/cpu.hpp .refs/ares/ares/n64/pif/hle.cpp

      - name: Retain result payload
        uses: actions/upload-artifact@v4
        with:
          name: ares-nmi-root-results
          path: target/ares-nmi-root/results.json
