name: research-solver-guest-overlap-closure

on:
  push:
    branches:
      - research/solver-guest-overlap-closure-gpt56sol
  workflow_dispatch:

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run guest-overlap solver regression
        run: cargo test -p plaid-core --test solver_guest_overlap -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test -p plaid-core
