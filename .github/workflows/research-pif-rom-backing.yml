name: Research PIF ROM backing

on:
  push:
    branches:
      - research/pif-rom-backing-ares-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact pinned ares
        run: |
          mkdir -p .refs
          git clone --no-tags https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares checkout 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = "9408cb43d4948fc3ea6e152a307a34348df3fe04"
          git -C .refs/ares diff --quiet HEAD
      - name: Recheck independent PIF backing model
        run: |
          python3 -m py_compile experiments/pif-rom-backing/witness_model.py experiments/pif-rom-backing/run_ares.py
          python3 experiments/pif-rom-backing/witness_model.py --fuzz 1000000 > /tmp/pif-model.json
          sha256sum experiments/pif-rom-backing/witness_model.py /tmp/pif-model.json
          grep -q '"positives": 92583' /tmp/pif-model.json
          grep -q '"negatives": 907417' /tmp/pif-model.json
          grep -q '"mirrored_positives": 92426' /tmp/pif-model.json
      - name: Build and run real pinned ares sensor
        id: sensor
        continue-on-error: true
        run: python3 experiments/pif-rom-backing/run_ares.py
      - name: Diagnose compiled scenarios after failure
        if: steps.sensor.outcome == 'failure'
        run: |
          set +e
          for kind in baseline instrumented; do
            exe="target/pif-rom-backing-ares/${kind}/oracle"
            echo "== ${kind} =="
            test -x "$exe" || { echo "missing $exe"; continue; }
            for mode in natural mirror high_mirror busy_latch lockout_zero pif_ram_same_value cached_pif stale_decoy nonfetch_rom; do
              echo "-- ${kind}/${mode} --"
              "$exe" "$mode" >"/tmp/${kind}-${mode}.out" 2>"/tmp/${kind}-${mode}.err"
              rc=$?
              echo "rc=$rc stdout_bytes=$(wc -c < "/tmp/${kind}-${mode}.out") stderr_bytes=$(wc -c < "/tmp/${kind}-${mode}.err")"
              cat "/tmp/${kind}-${mode}.out"
              cat "/tmp/${kind}-${mode}.err"
            done
          done
          exit 1
      - name: Require successful sensor run
        if: steps.sensor.outcome == 'success'
        run: echo "sensor run passed"
