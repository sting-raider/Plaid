name: Research import DMA intervening store

on:
  push:
    branches:
      - research/import-dma-intervening-store-gpt56sol
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard pinned Rabbitizer revision
        shell: bash
        run: |
          set -euo pipefail
          grep -q '724a49a5b4dbfb99f1a9e6992e63964fd29c90c8' Cargo.lock
      - name: Focused regression
        run: cargo test --locked -p plaid-core --test import_dma_intervening_store -- --nocapture
      - name: Full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
