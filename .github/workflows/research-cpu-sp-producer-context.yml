name: Research CPU SP producer context

on:
  push:
    branches: [research/cpu-sp-producer-context-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Compile Python verifier
        run: python3 -m py_compile spikes/043-ares-cpu-sp-producer-context/*.py
      - name: Build exact pinned ares and execute producer-context fixture
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 spikes/043-ares-cpu-sp-producer-context/run.py 2>&1 | tee /tmp/cpu-sp-producer-context.log
      - name: Publish bounded failure diagnostic
        if: steps.experiment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'CHECKPOINT DIAGNOSTIC'
            echo 'worker: gpt56sol-cpu-sp-producer-context-20261009'
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '```text'
            echo '--- runner tail ---'
            tail -n 35 /tmp/cpu-sp-producer-context.log
            if test -f target/ares-cpu-sp-producer-context/build.log; then
              echo '--- compiler errors ---'
              grep -nE 'driver\.cpp|error:|undefined reference|collect2:' target/ares-cpu-sp-producer-context/build.log | tail -n 100 || true
              echo '--- compiler tail ---'
              tail -n 35 target/ares-cpu-sp-producer-context/build.log
            fi
            echo '```'
          } > /tmp/diagnostic.md
          gh issue comment 4 --body-file /tmp/diagnostic.md
          exit 1
      - name: Publish successful receipt
        if: steps.experiment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'CHECKPOINT RECEIPT'
            echo 'worker: gpt56sol-cpu-sp-producer-context-20261009'
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '```text'
            tail -n 30 /tmp/cpu-sp-producer-context.log
            echo '```'
          } > /tmp/receipt.md
          gh issue comment 4 --body-file /tmp/receipt.md
      - name: Upload deterministic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-sp-producer-context-results
          path: target/ares-cpu-sp-producer-context/results.json
          if-no-files-found: ignore
