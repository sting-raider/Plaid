name: research-copy-event-kind-exclusivity

on:
  push:
    branches:
      - research/copy-event-kind-exclusivity-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply candidate fix
        run: python3 spikes/copy-event-kind-exclusivity/apply_candidate_fix.py
      - name: Run focused regression
        run: cargo test --locked -p plaid-core --test copy_event_kind_exclusivity -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
      - name: Commit validated candidate fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- crates/plaid-core/src/program.rs; then
            echo "candidate fix already committed"
            exit 0
          fi
          git config user.name "Plaid research worker"
          git config user.email "actions@users.noreply.github.com"
          git add crates/plaid-core/src/program.rs
          git commit -m "fix: reject cross-kind load copy events"
          git push origin HEAD:research/copy-event-kind-exclusivity-gpt56sol
