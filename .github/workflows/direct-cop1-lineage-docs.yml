name: Direct COP1 lineage docs append

on:
  push:
    branches:
      - direct-integration/cop1-lineage-gpt56sol-direct-cop1-lineage-20261011
    paths:
      - .github/workflows/direct-cop1-lineage-docs.yml

permissions:
  contents: write

jobs:
  append-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/cop1-lineage-gpt56sol-direct-cop1-lineage-20261011
      - name: Append canonical documentation
        shell: python
        run: |
          from pathlib import Path

          additions = {
              Path("docs/STATUS.md"): r'''

- Production now exposes bounded source-bound COP1 FPR byte-lineage replay.
  Successful aligned uncached identity-RDRAM LWC1/LDC1 definitions retain their
  exact completed source-read ordinal, FPR-write generation and captured FR
  context per physical FPR byte. MTC1/DMTC1 advance those byte generations even
  for equal payloads; failed loads mint none. SWC1/SDC1 ancestry is selected from
  the captured physical register and byte lanes at store time, preserving mixed
  origins. Complete-source SHA and full report replay reject deletion/forgery.
  The consumer intentionally does not derive physical storage from architectural
  ft/FR, so pinned ares odd-FR behavior is not promoted as hardware truth.
  Source-storage ancestry, complete FPR-writer/mutation census, cached/TLB/endian
  paths, executable consumption/lifetime and native completeness remain OPEN
  (ADR-0102).
''',
              Path("docs/NEXT.md"): r'''

Bounded COP1 source lineage now has a production replay consumer (ADR-0102):
explicit completed reads feed per-byte physical FPR generations, same-value
MTC1/DMTC1 definitions replace older origins, failed loads mint none, and stores
select ancestry from captured store-time physical lanes. Compose this with the
separate SWC1/SDC1 mutation-domain normalizer, actual RDRAM writer ancestry,
D-cache residency/writeback, successful TLB contexts, reverse-endian handling,
general FPR writers and eventual executable consumption/lifetimes. Do not derive
physical FPR identity from equal values or architectural ft/FR; the pinned ares
odd-FR behavior remains reference evidence rather than hardware truth.
''',
              Path("docs/DECISIONS.md"): r'''

## ADR-0102: COP1 lineage follows captured physical byte generations, not equal payloads

Status: Accepted for bounded compiler-time observed-history inspection, 2026-10-11.

Add an original source-bound replay for the validated uncached identity-RDRAM
COP1 load/store contract. A successful LWC1/LDC1 definition must cite its exact
completed read under the same context, phase, width and payload. Retain the read
ordinal, FPR-write ordinal and captured FR context on every affected physical FPR
byte. MTC1/DMTC1 create new byte generations even when values are unchanged;
failed CU1/alignment/TLB loads create none. SWC1/SDC1 ancestry comes from the
actual captured physical register and byte lanes selected at store time, so
mixed-width stores may legitimately retain mixed origins.

Do not infer the physical FPR from architectural ft/FR or matching payloads. The
capture supplies physical register/lane identity explicitly, avoiding promotion
of pinned ares odd-FR=0 behavior into an N64 hardware rule. Require an externally
trusted complete-source SHA and reconstruct every report field during verification.
The admitted memory path is deliberately limited to aligned uncached identity
RDRAM Word/Doubleword effects; unsupported paths reject rather than guessing.

This replay authenticates only its supplied finite history. It does not prove the
ultimate RDRAM writer, a complete FPR-writer or mutation census, cached/TLB/endian
behavior, executable consumption, cache-visible executable state, executable
lifetime, hardware FPR mapping, whole-ROM closure or native completeness. Keep
those obligations OPEN and compose the separate COP1 mutation-domain evidence
without collapsing source ancestry into mutation occurrence. No reference
implementation or runtime dependency enters production.
''',
          }

          for path, addition in additions.items():
              text = path.read_text()
              marker = {
                  "docs/STATUS.md": "Production now exposes bounded source-bound COP1 FPR byte-lineage replay.",
                  "docs/NEXT.md": "Bounded COP1 source lineage now has a production replay consumer (ADR-0102):",
                  "docs/DECISIONS.md": "## ADR-0102: COP1 lineage follows captured physical byte generations, not equal payloads",
              }[str(path)]
              if marker not in text:
                  path.write_text(text.rstrip() + addition + "\n")
      - name: Commit documentation
        run: |
          git config user.name "Plaid direct integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git add docs/STATUS.md docs/NEXT.md docs/DECISIONS.md
          if git diff --cached --quiet; then
            echo "Documentation markers already present"
          else
            git commit -m "docs: record bounded COP1 byte lineage"
            git push origin HEAD:direct-integration/cop1-lineage-gpt56sol-direct-cop1-lineage-20261011
          fi
