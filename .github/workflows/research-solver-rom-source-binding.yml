name: research-solver-rom-source-binding

on:
  push:
    branches:
      - research/solver-rom-source-binding-gpt56sol
  workflow_dispatch:

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify pinned Rabbitizer revision
        run: grep -F 'rev = "724a49a5b4dbfb99f1a9e6992e63964fd29c90c8"' refs.lock.toml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run ROM source-binding regression
        run: cargo test -p plaid-core --test solver_rom_source_binding -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test -p plaid-core
      - name: Run clippy
        run: cargo clippy -p plaid-core --all-targets -- -D warnings
