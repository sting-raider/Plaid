name: Reconcile cached exception root docs

on:
  push:
    branches:
      - direct-integration/exception-root-generation-gpt56sol-direct-exception-generation-20261011
    paths:
      - ".github/workflows/reconcile-exception-root-generation-docs.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: direct-integration/exception-root-generation-gpt56sol-direct-exception-generation-20261011
          fetch-depth: 0
      - name: Reconcile canonical docs and receipt
        run: python3 scripts/reconcile_exception_root_generation_docs.py
      - name: Remove one-off helper and commit
        shell: bash
        run: |
          git config user.name "Plaid direct integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git rm scripts/reconcile_exception_root_generation_docs.py
          git rm .github/workflows/reconcile-exception-root-generation-docs.yml
          git add docs/STATUS.md docs/NEXT.md docs/DECISIONS.md research/integration-receipts/20261011-exception-root-generation-gpt56sol-direct-exception-generation-20261011.md
          git commit -m "Reconcile cached exception root docs with BEV1 main"
          git push origin HEAD:direct-integration/exception-root-generation-gpt56sol-direct-exception-generation-20261011
