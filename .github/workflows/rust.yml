name: Rust checks

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "refs.lock.toml"
      - "scripts/test_cli.py"
      - "experiments/fetch-summary-realizability/model.py"
      - "spikes/044-ares-cpu-copy-dataflow/**"
      - "spikes/045-ares-cpu-xori-transform/**"
      - "spikes/046-ares-cpu-sp-producer-context/**"
      - "spikes/047-ares-rsp-cpu-imem-compose/**"
      - "spikes/048-ares-xori-cache-visibility/**"
      - "spikes/049-ares-pagemask-cache-remap/**"
      - "spikes/050-ares-pi-cache-visibility/**"
      - "spikes/051-ares-sp-dma-dmem-ingress/**"
      - "spikes/052-ares-rsp-store-isolation/**"
      - "spikes/053-ares-asid-cache-lifetime/**"
      - "spikes/054-ares-tlbr-cache-lifetime/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "refs.lock.toml"
      - "scripts/test_cli.py"
      - "experiments/fetch-summary-realizability/model.py"
      - "spikes/044-ares-cpu-copy-dataflow/**"
      - "spikes/045-ares-cpu-xori-transform/**"
      - "spikes/046-ares-cpu-sp-producer-context/**"
      - "spikes/047-ares-rsp-cpu-imem-compose/**"
      - "spikes/048-ares-xori-cache-visibility/**"
      - "spikes/049-ares-pagemask-cache-remap/**"
      - "spikes/050-ares-pi-cache-visibility/**"
      - "spikes/051-ares-sp-dma-dmem-ingress/**"
      - "spikes/052-ares-rsp-store-isolation/**"
      - "spikes/053-ares-asid-cache-lifetime/**"
      - "spikes/054-ares-tlbr-cache-lifetime/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the repository toolchain
        run: rustup show
      - name: Check exact decoder dependency pin
        shell: python {0}
        run: |
          from pathlib import Path
          import tomllib
          refs = tomllib.loads(Path("refs.lock.toml").read_text())
          reference = next(r for r in refs["repo"] if r["name"] == "rabbitizer")
          manifest = tomllib.loads(Path("crates/plaid-core/Cargo.toml").read_text())
          dependency = manifest["dependencies"]["rabbitizer"]
          assert dependency["git"] == reference["url"]
          assert dependency["rev"] == reference["rev"]
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          package = next(p for p in lock["package"] if p["name"] == "rabbitizer")
          expected = f'git+{reference["url"]}?rev={reference["rev"]}#{reference["rev"]}'
          assert package["source"] == expected
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --locked --workspace
      - name: Synthetic CLI checks
        run: python scripts/test_cli.py
      - name: Synthetic CPU-copy history contracts
        run: python spikes/044-ares-cpu-copy-dataflow/test_verify.py
      - name: Synthetic XORI history contracts
        run: python spikes/045-ares-cpu-xori-transform/test_verify.py
      - name: Synthetic CPU SP producer contracts
        run: python spikes/046-ares-cpu-sp-producer-context/test_verify.py
      - name: Synthetic RSP CPU IMEM composition contracts
        run: python spikes/047-ares-rsp-cpu-imem-compose/test_verify.py
      - name: Synthetic XORI cache visibility contracts
        run: python spikes/048-ares-xori-cache-visibility/test_verify.py
      - name: Synthetic PageMask cache remap contracts
        run: python spikes/049-ares-pagemask-cache-remap/test_verify.py
      - name: Synthetic PI cache visibility contracts
        run: python spikes/050-ares-pi-cache-visibility/test_verify.py
      - name: Synthetic SP DMA DMEM ingress contracts
        run: python spikes/051-ares-sp-dma-dmem-ingress/test_verify.py
      - name: Synthetic RSP store isolation contracts
        run: python spikes/052-ares-rsp-store-isolation/test_verify.py
      - name: Synthetic guest EntryHi cache reactivation contracts
        run: python spikes/053-ares-asid-cache-lifetime/test_verify.py
      - name: Synthetic guest TLBR cache reactivation contracts
        run: python spikes/054-ares-tlbr-cache-lifetime/test_verify.py
      - name: Independent fetch-summary assignment oracle
        run: python experiments/fetch-summary-realizability/model.py
      - name: Append reset-producer docs and restore canonical workflow
        if: github.event_name == 'pull_request' && github.head_ref == 'direct-integration/reset-producer-identity-gpt56sol-b9'
        run: |
          git fetch origin direct-integration/reset-producer-identity-gpt56sol-b9
          git checkout -B direct-integration/reset-producer-identity-gpt56sol-b9 origin/direct-integration/reset-producer-identity-gpt56sol-b9
          python - <<'PY'
          from pathlib import Path
          additions = {
              "docs/DECISIONS.md": '''\n\n## ADR-0104: Reset producer identity is generation-based, not pending-value identity\n\nStatus: Accepted for bounded compiler-time source-bound replay, 2026-10-11.\n\nAdopt an observed reset-producer history that keeps reset-request generations and HW2/NMI event generations explicit, unique and one-shot. Multiple active events may share the same delivery kind and schedule value without merging; an observed coalescing implementation may record an explicit supersession edge. Neither accumulation nor supersession is promoted to N64 hardware policy. Imported pending events whose request ancestry is unavailable remain producer-UNKNOWN even when their numeric fields match earlier events.\n\nThis follows the portable result shared by exact pinned Mupen64Plus and Gopher64 despite their disagreement: Mupen can accumulate distinct equal `(type,count)` queue nodes while Gopher uses a replaceable NMI slot, and both consume/disable a selected event before handler delivery. Equal pending state, type/count, PC or payload values therefore do not prove causal identity. Fresh exact-pin reproduction passed during integration. Physical reset timing, repeated-reset hardware semantics, producer census, save/restore identity, IRQ/NMI priority, NMI root/fetch/byte provenance, executable lifetime, whole-ROM closure and native completeness remain OPEN. No reference implementation code enters production and no solver gate is weakened.\n''',
              "docs/STATUS.md": '''\n\n- Production now exposes bounded source-bound `reset_producer` replay (ADR-0104). Reset requests and HW2/NMI delivery events carry explicit never-reused generations; deliveries consume one active event once, explicit supersession can represent an observed coalescing boundary, and imported pending events keep request ancestry UNKNOWN. Equal pending/type/count values never merge events. The model intentionally certifies neither Mupen-style accumulation nor Gopher-style replacement as hardware truth. Fresh exact-pin research reproduction and canonical Rust workspace/synthetic validation pass. Physical reset timing/repeated-reset semantics, complete producer census, save/restore identity, simultaneous IRQ/NMI priority, root fetch/byte provenance, executable lifetime, whole-ROM and native completeness remain OPEN.\n''',
              "docs/NEXT.md": '''\n\nProduction now has policy-neutral reset/HW2/NMI producer-generation replay (ADR-0104). Compose only certified NMI delivery generations into the separate NMI root-transfer/fetch/source chain; imported/unknown ancestry must remain UNKNOWN. Add an explicit save/restore chronology contract before preserving producer identity across restored pending rows, and retain Mupen/Gopher repeated-reset disagreement until stronger hardware/system-test evidence resolves it. Physical reset timing, complete producer/root census, simultaneous IRQ/NMI priority, executable lifetime and whole-ROM closure remain OPEN.\n''',
          }
          markers = {
              "docs/DECISIONS.md": "## ADR-0104: Reset producer identity is generation-based, not pending-value identity",
              "docs/STATUS.md": "Production now exposes bounded source-bound `reset_producer` replay",
              "docs/NEXT.md": "Production now has policy-neutral reset/HW2/NMI producer-generation replay",
          }
          for name, addition in additions.items():
              path = Path(name)
              text = path.read_text()
              if markers[name] not in text:
                  path.write_text(text.rstrip() + addition + "\n")
          PY
          git checkout HEAD^ -- .github/workflows/rust.yml
          git config user.name "Plaid direct integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git add .github/workflows/rust.yml docs/DECISIONS.md docs/STATUS.md docs/NEXT.md
          git commit -m "Document reset producer identity boundary"
          git push origin HEAD:direct-integration/reset-producer-identity-gpt56sol-b9
