name: Rust checks

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "refs.lock.toml"
      - "scripts/test_cli.py"
      - "experiments/fetch-summary-realizability/model.py"
      - "spikes/044-ares-cpu-copy-dataflow/**"
      - "spikes/045-ares-cpu-xori-transform/**"
      - "spikes/046-ares-cpu-sp-producer-context/**"
      - "spikes/047-ares-rsp-cpu-imem-compose/**"
      - "spikes/048-ares-xori-cache-visibility/**"
      - "spikes/049-ares-pagemask-cache-remap/**"
      - "spikes/050-ares-pi-cache-visibility/**"
      - "spikes/051-ares-sp-dma-dmem-ingress/**"
      - "spikes/052-ares-rsp-store-isolation/**"
      - "spikes/053-ares-asid-cache-lifetime/**"
      - "spikes/054-ares-tlbr-cache-lifetime/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "refs.lock.toml"
      - "scripts/test_cli.py"
      - "experiments/fetch-summary-realizability/model.py"
      - "spikes/044-ares-cpu-copy-dataflow/**"
      - "spikes/045-ares-cpu-xori-transform/**"
      - "spikes/046-ares-cpu-sp-producer-context/**"
      - "spikes/047-ares-rsp-cpu-imem-compose/**"
      - "spikes/048-ares-xori-cache-visibility/**"
      - "spikes/049-ares-pagemask-cache-remap/**"
      - "spikes/050-ares-pi-cache-visibility/**"
      - "spikes/051-ares-sp-dma-dmem-ingress/**"
      - "spikes/052-ares-rsp-store-isolation/**"
      - "spikes/053-ares-asid-cache-lifetime/**"
      - "spikes/054-ares-tlbr-cache-lifetime/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the repository toolchain
        run: rustup show
      - name: Check exact decoder dependency pin
        shell: python {0}
        run: |
          from pathlib import Path
          import tomllib
          refs = tomllib.loads(Path("refs.lock.toml").read_text())
          reference = next(r for r in refs["repo"] if r["name"] == "rabbitizer")
          manifest = tomllib.loads(Path("crates/plaid-core/Cargo.toml").read_text())
          dependency = manifest["dependencies"]["rabbitizer"]
          assert dependency["git"] == reference["url"]
          assert dependency["rev"] == reference["rev"]
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          package = next(p for p in lock["package"] if p["name"] == "rabbitizer")
          expected = f'git+{reference["url"]}?rev={reference["rev"]}#{reference["rev"]}'
          assert package["source"] == expected
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Strict workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Full workspace tests
        run: cargo test --locked --workspace
      - name: Synthetic CLI checks
        run: python scripts/test_cli.py
      - name: Synthetic CPU-copy history contracts
        run: python spikes/044-ares-cpu-copy-dataflow/test_verify.py
      - name: Synthetic XORI history contracts
        run: python spikes/045-ares-cpu-xori-transform/test_verify.py
      - name: Synthetic CPU SP producer contracts
        run: python spikes/046-ares-cpu-sp-producer-context/test_verify.py
      - name: Synthetic RSP CPU IMEM composition contracts
        run: python spikes/047-ares-rsp-cpu-imem-compose/test_verify.py
      - name: Synthetic XORI cache visibility contracts
        run: python spikes/048-ares-xori-cache-visibility/test_verify.py
      - name: Synthetic PageMask cache remap contracts
        run: python spikes/049-ares-pagemask-cache-remap/test_verify.py
      - name: Synthetic PI cache visibility contracts
        run: python spikes/050-ares-pi-cache-visibility/test_verify.py
      - name: Synthetic SP DMA DMEM ingress contracts
        run: python spikes/051-ares-sp-dma-dmem-ingress/test_verify.py
      - name: Synthetic RSP store isolation contracts
        run: python spikes/052-ares-rsp-store-isolation/test_verify.py
      - name: Synthetic guest EntryHi cache reactivation contracts
        run: python spikes/053-ares-asid-cache-lifetime/test_verify.py
      - name: Synthetic guest TLBR cache reactivation contracts
        run: python spikes/054-ares-tlbr-cache-lifetime/test_verify.py
      - name: Independent fetch-summary assignment oracle
        run: python experiments/fetch-summary-realizability/model.py
      - name: Append NMI integration docs and restore canonical workflow
        if: github.event_name == 'pull_request' && github.head_ref == 'direct-integration/nmi-root-provenance-gpt56sol-b9'
        run: |
          git fetch origin direct-integration/nmi-root-provenance-gpt56sol-b9
          git checkout -B direct-integration/nmi-root-provenance-gpt56sol-b9 origin/direct-integration/nmi-root-provenance-gpt56sol-b9
          python - <<'PY'
          from pathlib import Path
          additions = {
              "docs/DECISIONS.md": '''\n\n## ADR-0103: NMI root transfer, fetch occurrence and byte provenance are separate evidence\n\nStatus: Accepted for bounded compiler-time source-bound replay, 2026-10-11.\n\nAdopt an original ordered-history verifier for the validated NMI-root composition\nboundary. An architectural transfer to `ffffffffbfc00000` does not prove that the\nroot instruction was fetched: a still-asserted NMI level can preempt the next\ninstruction step and re-enter NMI with zero root fetches. A root fetch becomes\neligible only after an observed post-transfer deassertion in the supplied bounded\nhistory. PIF-ROM provenance then requires the actual uncached root fetch at\nphysical `1fc00000`, one unique same-context offset-zero PIF read and a matching\ncompleted fetch explicitly classified as PIF-ROM sourced.\n\nKeep transfer identity, fetch occurrence and executed-byte source identity as\nseparate facts. Root address, current/supplied firmware, equal fetched words,\nforeign reads or finite trace membership cannot substitute for the causal chain.\nContiguous source ordinals, unique fetch contexts and complete-capture hash\nbinding reject deletion, reordering and context reuse; the capture hash names the\nsource namespace but does not by itself certify producer completeness. Missing or\nambiguous source evidence remains UNKNOWN.\n\nThe fresh exact-pinned ares rerun at\n`9408cb43d4948fc3ea6e152a307a34348df3fe04` passed the source guards, exact\nreference fixture and seven-forgery chronology model. This is not a physical N64\nreset/NMI timing result and does not choose a repeated-reset policy, certify NMI\nproducer/deassertion coverage, simultaneous interrupt priority, save/restore,\ncomplete PIF/HLE sources, executable lifetime, a complete root census or native\ncompleteness. No solver gate is weakened and no reference implementation code or\nruntime dependency enters production.\n''',
              "docs/STATUS.md": '''\n\n- Production now exposes bounded source-bound `root_execution` replay for the NMI\n  root composition boundary (ADR-0103). It keeps architectural transfer to\n  `ffffffffbfc00000`, observed progress to a root fetch, and executed-byte source\n  identity independent. Certification requires an observed deassertion plus one\n  unique uncached `1fc00000` fetch context with an in-context offset-zero PIF-ROM\n  read matching the completed word. Transfer-only/persistent-NMI histories,\n  equal-valued SI/foreign reads, wrong context/offset, ambiguous reads, ordinal\n  deletion/reordering and context reuse fail closed. Fresh exact-pinned ares\n  reproduction and the full canonical Rust workspace/synthetic suite pass.\n  NMI/reset producer completeness, hardware timing, interrupt priority,\n  save/restore, complete root-source census, executable lifetime, whole-ROM and\n  native completeness remain OPEN.\n''',
              "docs/NEXT.md": '''\n\nProduction now has bounded source-bound NMI root execution composition\n(ADR-0103). Compose it next with an authenticated NMI/reset producer and\ndeassertion chronology, one-shot delivery identity, save/restore/reset epochs and\ncomplete root-source sensing. Keep architectural root transfer separate from\nprogress to a fetch and from executed-byte provenance. A persistent pending level,\nroot address, supplied firmware or equal word cannot manufacture a root execution\ncertificate. Simultaneous interrupt/NMI ordering, physical reset semantics,\ncomplete PIF/HLE source coverage, executable lifetime and whole-ROM root census\nremain OPEN.\n''',
          }
          markers = {
              "docs/DECISIONS.md": "## ADR-0103: NMI root transfer, fetch occurrence and byte provenance are separate evidence",
              "docs/STATUS.md": "Production now exposes bounded source-bound `root_execution` replay",
              "docs/NEXT.md": "Production now has bounded source-bound NMI root execution composition",
          }
          for name, addition in additions.items():
              path = Path(name)
              text = path.read_text()
              if markers[name] not in text:
                  path.write_text(text.rstrip() + addition + "\n")
          PY
          git checkout HEAD^ -- .github/workflows/rust.yml
          git config user.name "Plaid direct integration"
          git config user.email "143122949+sting-raider@users.noreply.github.com"
          git add .github/workflows/rust.yml docs/DECISIONS.md docs/STATUS.md docs/NEXT.md
          git commit -m "Document NMI root execution provenance boundary"
          git push origin HEAD:direct-integration/nmi-root-provenance-gpt56sol-b9
