name: direct-integration-exception-roots-validate

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/plaid-core/src/exception_roots.rs"
      - ".github/workflows/direct-integration-exception-roots-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exception-vector-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares revision
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check runner
        run: python3 -m py_compile spikes/019-ares-exception-vectors/run.py

      - name: Build and execute guest-triggered matrix
        run: python3 spikes/019-ares-exception-vectors/run.py

      - name: Verify durable result hash
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum target/ares-exception-vectors/results.json | cut -d' ' -f1)
          test "$actual" = 9e9aff42c258177daa94f9de8be296c816735b67c2a4d0c04fdb89501d322de7
