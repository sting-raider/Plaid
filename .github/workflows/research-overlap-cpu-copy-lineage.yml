name: Research overlapping CPU copy lineage

on:
  push:
    branches:
      - research/overlap-cpu-copy-lineage-gpt56sol
  workflow_dispatch:

jobs:
  exact-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard composition inputs
        run: |
          set -euxo pipefail
          grep -F 'rev = "9408cb43d4948fc3ea6e152a307a34348df3fe04"' refs.lock.toml
          git fetch origin research/ares-cpu-copy-dataflow-gpt56sol
          test "$(git rev-parse FETCH_HEAD)" = "7079fe6d46b6a7ec5a0bc34cf52049e1b5d7385c"
          git show FETCH_HEAD:research/ares-cpu-copy-dataflow.md | grep -F 'Result: **VALIDATED**'
          git show FETCH_HEAD:research/ares-cpu-copy-dataflow.md | grep -F 'c1d57fd0d2e028feaf9fe0a9962ed6f6497091bf'
          git show FETCH_HEAD:research/ares-cpu-copy-dataflow.md | grep -F '37915748860'
      - name: Run deterministic overlap replay twice
        run: |
          set -euxo pipefail
          mkdir -p target/overlap-cpu-copy-lineage
          python3 experiments/overlap_cpu_copy_lineage/model.py | tee target/overlap-cpu-copy-lineage/model-1.log
          python3 experiments/overlap_cpu_copy_lineage/model.py > target/overlap-cpu-copy-lineage/model-2.log
          cmp target/overlap-cpu-copy-lineage/model-1.log target/overlap-cpu-copy-lineage/model-2.log
          grep -F 'REPORT_SHA256=a233772b218285ab7f69be3d4b2c6ed7f13cb8c22ba66cb01f730aa2e67e5523' target/overlap-cpu-copy-lineage/model-1.log
      - name: Fetch exact ares reference
        run: |
          mkdir -p .refs
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares checkout 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = "9408cb43d4948fc3ea6e152a307a34348df3fe04"
          git -C .refs/ares diff --quiet HEAD
          grep -F 'auto CPU::LW(' .refs/ares/ares/n64/cpu/interpreter-ipu.cpp
          grep -F 'auto CPU::SW(' .refs/ares/ares/n64/cpu/interpreter-ipu.cpp
      - name: Run exact-pinned ares overlap fixture
        run: |
          set -o pipefail
          python3 spikes/overlap-cpu-copy-lineage/run.py | tee target/overlap-cpu-copy-lineage/actual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlap-cpu-copy-lineage-results
          path: |
            target/overlap-cpu-copy-lineage/actual.json
            target/overlap-cpu-copy-lineage/actual.log
            target/overlap-cpu-copy-lineage/model-1.log
            target/overlap-cpu-copy-lineage/model-2.log
            target/overlap-cpu-copy-lineage/**/build.log
          if-no-files-found: warn
