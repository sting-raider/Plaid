name: Research RSP DMEM CPU refetch composition

on:
  push:
    branches: [research/rsp-dmem-cpu-refetch-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Syntax check
        run: python3 -m py_compile spikes/043-ares-rsp-dmem-cpu-refetch/prepare.py spikes/043-ares-rsp-dmem-cpu-refetch/run.py
      - name: Execute exact pinned ares composition
        id: exact
        shell: bash
        run: |
          mkdir -p target/ares-rsp-dmem-cpu-refetch
          set +e
          python3 spikes/043-ares-rsp-dmem-cpu-refetch/run.py > target/ares-rsp-dmem-cpu-refetch/ci-output.txt 2>&1
          status=$?
          cat target/ares-rsp-dmem-cpu-refetch/ci-output.txt
          if [ "$status" -ne 0 ]; then
            find target/ares-rsp-dmem-cpu-refetch -name '*build.log' -type f -print -exec tail -n 100 {} \; > target/ares-rsp-dmem-cpu-refetch/build-tail.txt || true
            cat target/ares-rsp-dmem-cpu-refetch/build-tail.txt || true
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Publish failure diagnostic
        if: failure() && steps.exact.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'CHECKPOINT'
            echo 'worker: gpt56sol-rsp-dmem-cpu-refetch-20261009'
            echo "branch: $GITHUB_REF_NAME"
            echo "head: $GITHUB_SHA"
            echo "exact_pin_run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'status: exact pinned ares experiment failed; diagnostic follows'
            echo '```text'
            tail -n 80 target/ares-rsp-dmem-cpu-refetch/ci-output.txt 2>/dev/null || true
            tail -n 80 target/ares-rsp-dmem-cpu-refetch/build-tail.txt 2>/dev/null || true
            echo '```'
          } > target/ares-rsp-dmem-cpu-refetch/ledger-failure.md
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body-file target/ares-rsp-dmem-cpu-refetch/ledger-failure.md
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsp-dmem-cpu-refetch-diagnostics
          path: |
            target/ares-rsp-dmem-cpu-refetch/ci-output.txt
            target/ares-rsp-dmem-cpu-refetch/build-tail.txt
            target/ares-rsp-dmem-cpu-refetch/results.json
          if-no-files-found: ignore
