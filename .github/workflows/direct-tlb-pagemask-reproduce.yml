name: direct-tlb-pagemask-reproduce

on:
  push:
    branches:
      - direct-integration/tlb-uncached-pagemask-gpt56sol-direct-tlb-uncached-pagemask-20261011
  workflow_dispatch:

jobs:
  exact-pin-current-main-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore validated research harness only
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin 409017c6be4aff64b53f1d93161cc23d4696aee6
          git checkout 409017c6be4aff64b53f1d93161cc23d4696aee6 -- experiments/tlb-pagemask
      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs/ares .refs/n64-systemtest
          git -C .refs/ares init
          git -C .refs/ares remote add origin https://github.com/ares-emulator/ares.git
          git -C .refs/ares fetch --depth=1 origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach FETCH_HEAD
          git -C .refs/n64-systemtest init
          git -C .refs/n64-systemtest remote add origin https://github.com/lemmy-64/n64-systemtest.git
          git -C .refs/n64-systemtest fetch --depth=1 origin 196f5421173220eb2f63a7a99c64795dc0ea0698
          git -C .refs/n64-systemtest checkout --detach FETCH_HEAD
      - name: Reproduce PageMask model and exact-reference matrix
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile experiments/tlb-pagemask/source_guard.py experiments/tlb-pagemask/source_model.py experiments/tlb-pagemask/run.py
          python3 experiments/tlb-pagemask/source_model.py | tee /tmp/model.txt
          grep -F 'a5d4638e35372905086b57571edb56e96d5d682cf78bf11ef606e7bb6765939a' /tmp/model.txt
          python3 experiments/tlb-pagemask/run.py
          sha256sum target/ares-tlb-pagemask/results.json | tee /tmp/results.sha256
          grep -F '486296f8df73a1f0b7ccc2a4849df9130d69084b5bfed4e7c1e2ecc41edaac56' /tmp/results.sha256
      - name: Upload reproduction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-tlb-pagemask-reproduction
          path: target/ares-tlb-pagemask/
