name: research-word-store-event-uniqueness

on:
  push:
    branches:
      - research/word-store-event-uniqueness-gpt56sol
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply candidate guard
        run: git apply --recount research/word-store-event-uniqueness.patch
      - name: Format candidate working tree
        run: cargo fmt --all
      - name: Preserve formatted diffs
        run: |
          mkdir -p target/research-word-store-event-uniqueness
          git diff > target/research-word-store-event-uniqueness/formatted-all.patch
          git diff -- crates/plaid-core/src/program.rs > target/research-word-store-event-uniqueness/formatted-production.patch
          test -s target/research-word-store-event-uniqueness/formatted-production.patch
      - name: Focused regression
        run: cargo test --locked -p plaid-core --test word_store_event_uniqueness
      - name: Full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
      - name: Upload formatted candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-store-event-uniqueness-candidate
          path: target/research-word-store-event-uniqueness/*.patch
          if-no-files-found: error
