name: research-mtc0-entryhi-asid

on:
  push:
    branches:
      - research/mtc0-entryhi-asid-gpt56sol
  workflow_dispatch:

jobs:
  mtc0-entryhi-asid-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned ares
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Syntax-check and adversarial model
        run: |
          python3 -m py_compile experiments/mtc0-entryhi-asid/run.py experiments/mtc0-entryhi-asid/source_guard.py experiments/mtc0-entryhi-asid/model.py
          python3 experiments/mtc0-entryhi-asid/model.py

      - name: Guard exact source contract
        run: python3 experiments/mtc0-entryhi-asid/source_guard.py

      - name: Build and execute exact-reference matrix
        run: python3 experiments/mtc0-entryhi-asid/run.py

      - name: Hash durable result payload
        run: sha256sum target/ares-mtc0-entryhi-asid/results.json

      - name: Upload exact result payload
        uses: actions/upload-artifact@v4
        with:
          name: mtc0-entryhi-asid-results
          path: target/ares-mtc0-entryhi-asid/results.json
