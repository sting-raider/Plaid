name: Research Gopher SDC1 SP executable sink

on:
  push:
    branches: [research/gopher-sdc1-sp-exec-gpt56sol]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gopher64/gopher64
          ref: e96debac941a26ba4961e5145056c0821d3a56f7
          path: .refs/gopher64
          submodules: recursive
      - name: Install pinned Gopher Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
          cargo --version
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev libfontconfig1-dev
          command -v llvm-ar
      - name: Compile Plaid probe runner
        run: python3 -m py_compile spikes/044-gopher-sdc1-sp-exec/run.py
      - name: Isolate nested Gopher Cargo workspace
        run: printf '\n[workspace]\n' >> .refs/gopher64/Cargo.toml
      - name: Execute exact-pin Gopher COP1 to SP differential
        run: python3 spikes/044-gopher-sdc1-sp-exec/run.py
