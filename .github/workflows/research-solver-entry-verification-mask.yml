name: research-solver-entry-verification-mask

on:
  push:
    branches:
      - research/solver-entry-verification-mask-gpt56sol

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Focused solver regression
        run: cargo test --locked -p plaid-core --test solver -- --nocapture
      - name: Full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
