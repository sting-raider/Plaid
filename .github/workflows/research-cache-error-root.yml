name: research-cache-error-root

on:
  push:
    branches:
      - research/cache-error-root-sol
  workflow_dispatch:

jobs:
  cache-error-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git clone --filter=blob:none --no-checkout https://github.com/lemmy-64/n64-systemtest.git .refs/n64-systemtest
          git -C .refs/n64-systemtest fetch origin 196f5421173220eb2f63a7a99c64795dc0ea0698
          git -C .refs/n64-systemtest checkout --detach 196f5421173220eb2f63a7a99c64795dc0ea0698
          git clone --filter=blob:none --no-checkout https://github.com/gopher64/gopher64.git .refs/gopher64
          git -C .refs/gopher64 fetch origin e96debac941a26ba4961e5145056c0821d3a56f7
          git -C .refs/gopher64 checkout --detach e96debac941a26ba4961e5145056c0821d3a56f7

      - name: Syntax check
        run: python3 -m py_compile experiments/cache-error-root-obligation/run.py experiments/cache-error-root-obligation/model.py

      - name: Run fail-closed certificate model twice
        shell: bash
        run: |
          set -euxo pipefail
          python3 experiments/cache-error-root-obligation/model.py > /tmp/model1.txt
          python3 experiments/cache-error-root-obligation/model.py > /tmp/model2.txt
          cmp /tmp/model1.txt /tmp/model2.txt
          cat /tmp/model1.txt
          sha256sum /tmp/model1.txt experiments/cache-error-root-obligation/model.py

      - name: Build and execute exact-pinned ares guest fixture
        run: python3 experiments/cache-error-root-obligation/run.py

      - name: Hash result payload
        run: sha256sum target/cache-error-root-obligation/results.json

      - uses: actions/upload-artifact@v4
        with:
          name: cache-error-root-evidence
          path: |
            target/cache-error-root-obligation/results.json
            /tmp/model1.txt
