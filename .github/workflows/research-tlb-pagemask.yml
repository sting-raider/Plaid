name: research-tlb-pagemask

on:
  push:
    branches:
      - research/tlb-pagemask-gpt56sol
  workflow_dispatch:

jobs:
  exact-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned references
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs/ares .refs/n64-systemtest
          git -C .refs/ares init
          git -C .refs/ares remote add origin https://github.com/ares-emulator/ares.git
          git -C .refs/ares fetch --depth=1 origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach FETCH_HEAD
          git -C .refs/n64-systemtest init
          git -C .refs/n64-systemtest remote add origin https://github.com/lemmy-64/n64-systemtest.git
          git -C .refs/n64-systemtest fetch --depth=1 origin 196f5421173220eb2f63a7a99c64795dc0ea0698
          git -C .refs/n64-systemtest checkout --detach FETCH_HEAD
      - name: Syntax and independent model checks
        run: |
          python3 -m py_compile experiments/tlb-pagemask/source_guard.py experiments/tlb-pagemask/source_model.py experiments/tlb-pagemask/run.py
          python3 experiments/tlb-pagemask/source_model.py
      - name: Build and execute exact pinned PageMask matrix
        run: python3 experiments/tlb-pagemask/run.py
      - name: Upload research receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlb-pagemask-results
          path: target/ares-tlb-pagemask/
