name: Direct integration exception-root reproduction

on:
  pull_request:
    paths:
      - "crates/plaid-core/src/exception_root_history.rs"
      - ".github/workflows/direct-integration-exception-root-repro.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install repository toolchain
        run: rustup show
      - name: Apply canonical rustfmt
        run: cargo fmt --all
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- crates/plaid-core/src/exception_root_history.rs; then
            git config user.name "plaid-direct-integration"
            git config user.email "actions@users.noreply.github.com"
            git add crates/plaid-core/src/exception_root_history.rs
            git commit -m "Format exception-root history replay"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize validated research fixture
        run: |
          git fetch origin 50c160680c936c1801fabe32907ca45304d3d313 --depth=1
          mkdir -p experiments spikes/044-ares-exception-root-generation
          git show 50c160680c936c1801fabe32907ca45304d3d313:experiments/exception_root_generation.py > experiments/exception_root_generation.py
          git show 50c160680c936c1801fabe32907ca45304d3d313:spikes/044-ares-exception-root-generation/driver.cpp > spikes/044-ares-exception-root-generation/driver.cpp
          git show 50c160680c936c1801fabe32907ca45304d3d313:spikes/044-ares-exception-root-generation/run.py > spikes/044-ares-exception-root-generation/run.py
          git show 50c160680c936c1801fabe32907ca45304d3d313:spikes/044-ares-exception-root-generation/results.json > spikes/044-ares-exception-root-generation/results.json
      - uses: actions/checkout@v4
        with:
          repository: ares-emulator/ares
          ref: 9408cb43d4948fc3ea6e152a307a34348df3fe04
          path: .refs/ares
      - name: Reproduce adversarial reducer
        run: |
          python3 -m py_compile experiments/exception_root_generation.py spikes/044-ares-exception-root-generation/run.py
          python3 experiments/exception_root_generation.py
          python3 experiments/exception_root_generation.py
      - name: Reproduce exact pinned ares stale-handler fixture
        run: python3 spikes/044-ares-exception-root-generation/run.py
