name: research-dma-event-uniqueness

on:
  push:
    branches:
      - research/dma-event-uniqueness-gpt56sol
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plaid-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply candidate fix
        run: python3 spikes/dma-event-uniqueness/apply_candidate_fix.py
      - name: Run DMA copy-event uniqueness regression
        run: cargo test --locked -p plaid-core --test dma_event_uniqueness -- --nocapture
      - name: Run full plaid-core suite
        run: cargo test --locked -p plaid-core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked -p plaid-core --all-targets -- -D warnings
      - name: Commit validated candidate fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- crates/plaid-core/src/program.rs; then
            echo "candidate fix already committed"
            exit 0
          fi
          git config user.name "Plaid research worker"
          git config user.email "actions@users.noreply.github.com"
          git add crates/plaid-core/src/program.rs
          git commit -m "fix: bind load copy events to unique DMA transactions"
          git push origin HEAD:research/dma-event-uniqueness-gpt56sol
