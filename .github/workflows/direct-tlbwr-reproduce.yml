name: direct-tlbwr-reproduce

on:
  push:
    branches:
      - direct-integration/tlbwr-generation-gpt56sol-direct-tlbwr-generation-20261011
  workflow_dispatch:

jobs:
  reproduce-tlbwr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Focused production regressions
        run: cargo test --locked -p plaid-core --test tlb_history --test tlbwr_history

      - name: Materialize exact validated research fixture
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin 62f722a0c4db72963f6c873ddd33b8df95ddbc7e
          mkdir -p spikes/044-ares-tlbwr-mapping-generation
          for path in README.md driver.cpp model.py run.py source_guard.py; do
            git show 62f722a0c4db72963f6c873ddd33b8df95ddbc7e:spikes/044-ares-tlbwr-mapping-generation/$path > spikes/044-ares-tlbwr-mapping-generation/$path
          done
          test "$(git hash-object spikes/044-ares-tlbwr-mapping-generation/driver.cpp)" = 9b04329e277728b270d1f678252f31a26c46c94f
          test "$(git hash-object spikes/044-ares-tlbwr-mapping-generation/model.py)" = e94d8fd7c25d9559341e17ba8c754f8462e7fa7f
          test "$(git hash-object spikes/044-ares-tlbwr-mapping-generation/run.py)" = 93aa2da34d4d8b30fb01a6e58c85bd766555dbed
          test "$(git hash-object spikes/044-ares-tlbwr-mapping-generation/source_guard.py)" = ebce5b437e9074e8a229a5d48922530459d41847

      - name: Fetch exact pinned ares
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .refs
          git clone --filter=blob:none --no-checkout https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares fetch origin 9408cb43d4948fc3ea6e152a307a34348df3fe04
          git -C .refs/ares checkout --detach 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = 9408cb43d4948fc3ea6e152a307a34348df3fe04

      - name: Reproduce exact source contract and adversarial model
        run: |
          python3 -m py_compile spikes/044-ares-tlbwr-mapping-generation/run.py spikes/044-ares-tlbwr-mapping-generation/source_guard.py spikes/044-ares-tlbwr-mapping-generation/model.py
          python3 spikes/044-ares-tlbwr-mapping-generation/model.py
          python3 spikes/044-ares-tlbwr-mapping-generation/source_guard.py

      - name: Execute exact-reference matrix
        run: python3 spikes/044-ares-tlbwr-mapping-generation/run.py

      - name: Require reproduced durable result
        shell: bash
        run: |
          set -euxo pipefail
          test "$(sha256sum target/ares-tlbwr-mapping-generation/results.json | cut -d' ' -f1)" = 405def4f3c1e33c9cd0a8dd331ee1d33d0e664d1c578692989623796d986c11c

      - name: Upload reproduction receipt
        uses: actions/upload-artifact@v4
        with:
          name: direct-tlbwr-reproduction
          path: target/ares-tlbwr-mapping-generation/results.json
