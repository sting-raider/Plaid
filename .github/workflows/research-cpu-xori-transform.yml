name: Research CPU XORI transform provenance

on:
  push:
    branches:
      - research/cpu-xori-transform-gpt56sol
  workflow_dispatch:

jobs:
  exact-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact ares reference
        run: |
          mkdir -p .refs
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git .refs/ares
          git -C .refs/ares checkout 9408cb43d4948fc3ea6e152a307a34348df3fe04
          test "$(git -C .refs/ares rev-parse HEAD)" = "9408cb43d4948fc3ea6e152a307a34348df3fe04"
          git -C .refs/ares diff --quiet HEAD
      - name: Syntax check
        run: python3 -m py_compile spikes/043-ares-cpu-xori-transform-gpt56sol/run.py spikes/043-ares-cpu-xori-transform-gpt56sol/prepare.py
      - name: Run exact-pin experiment
        run: |
          set -o pipefail
          mkdir -p target/ares-cpu-xori-transform-spike
          python3 spikes/043-ares-cpu-xori-transform-gpt56sol/run.py | tee target/ares-cpu-xori-transform-spike/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ares-cpu-xori-transform-results
          path: |
            target/ares-cpu-xori-transform-spike/results.json
            target/ares-cpu-xori-transform-spike/run.log
            target/ares-cpu-xori-transform-spike/**/flow-build.log
          if-no-files-found: warn
