[workspace]
resolver = "3"
members = [
    "crates/plaid-core",
    "crates/plaid-lower",
    "apps/plaid",
]

# Proof and analysis tests run in about a tenth of the unoptimized time;
# overflow checks and debug assertions stay on (research/native-build-iteration.md).
# Rebuilds after a crate edit take ~20 s instead of ~150 s; analysis outputs are identical.
[profile.release]
incremental = true

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false
