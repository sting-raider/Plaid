[package]
name = "plaid-launcher"
version = "0.1.0"
description = "Plaid game library: scan N64 ROMs, recompile them natively, play them"
authors = ["The Plaid contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"

# Standalone: Tauri's dependency tree stays out of the recompiler's workspace gate.
[workspace]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows (cargo#8519).
name = "plaid_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
discord-rich-presence = "1.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
